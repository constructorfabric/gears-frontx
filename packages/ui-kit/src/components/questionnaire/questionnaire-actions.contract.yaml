# Semantic overlay for QuestionnaireActions - a part of the Questionnaire
# family, see questionnaire.contract.yaml's `family_membership`. A plain
# styled div; no engine part underneath.
component: questionnaire-actions

intent: The row that lays out a Questionnaire's navigation buttons, Previous at the start and Skip plus Next or Submit at the end.

typical_uses:
  - The navigation row under the questions

dont_use_when:
  - situation: A row of buttons outside a questionnaire
    instead:
      target: the application's own layout
      note: >-
        QuestionnaireActions is a fixed three-cell grid for the four
        navigation buttons and holds nothing else; ButtonGroup joins buttons
        into one attached row, which is a different layout.

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_previous.v1 # QuestionnairePrevious
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_skip.v1 # QuestionnaireSkip
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_next.v1 # QuestionnaireNext
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_submit.v1 # QuestionnaireSubmit

invariants:
  - id: fixed-grid-cells
    text: >-
      questionnaire.module.css places each button in a fixed cell of a
      three-column grid - Previous in the first, Skip in the second, Next
      and Submit sharing the third - whatever their source order.

anti_patterns:
  - dont: Mount only the buttons the current item needs
    do_instead: >-
      Mount all four every time; each hides itself (native `hidden` and
      `inert`) when it does not apply, and Next and Submit swap within one
      cell

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: All four buttons
      code: |
        <QuestionnaireActions>
          <QuestionnairePrevious />
          <QuestionnaireSkip />
          <QuestionnaireNext />
          <QuestionnaireSubmit />
        </QuestionnaireActions>
  bad:
    - title: Next and Submit chosen by the caller
      code: |
        <QuestionnaireActions>
          {isLast ? <QuestionnaireSubmit /> : <QuestionnaireNext />}
        </QuestionnaireActions>
      why: >-
        The root already hides whichever of the two does not apply; picking
        one by hand duplicates that state and drifts when an item is
        disabled or the flow moves under the caller.

family_membership:
  name: questionnaire
  role: part

# Semantic overlay for QuestionnaireTitle - a part of the Questionnaire
# family, see questionnaire.contract.yaml's `family_membership`.
component: questionnaire-title

intent: The question's own text, rendered as the legend of its QuestionnaireItem's fieldset.

typical_uses:
  - The question an item asks

dont_use_when:
  - situation: A caption for a group of fields in an ordinary form
    instead:
      target: FieldLegend inside a FieldSet
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field_legend.v1
      note: A QuestionnaireTitle throws outside a QuestionnaireItem.

accepts:
  content: specified
  text: true

invariants:
  - id: legend-names-the-item
    text: >-
      It renders a `<legend>`; the first legend child of the item's
      fieldset is that fieldset's caption and its accessible name.

anti_patterns:
  - dont: Put the question in a heading or paragraph inside the item instead of QuestionnaireTitle
    do_instead: Use QuestionnaireTitle, so the question names the item's fieldset for assistive technology

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: questionnaire.test.tsx asserts the title renders as a LEGEND inside the current item's fieldset
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      The questionnaire engine's render prop takes an element or a function
      of the title's state (an empty state object for this part), so its
      type is a union of a React element and a callback; the compiler emits
      one JSON type per property, so nothing is asserted.

examples:
  good:
    - title: The question of an item
      code: |
        <QuestionnaireItem name="role" required>
          <QuestionnaireTitle>What is your role?</QuestionnaireTitle>
          <QuestionnaireChoices>{choices}</QuestionnaireChoices>
          <QuestionnaireError />
        </QuestionnaireItem>
  bad:
    - title: A heading in place of the title
      code: |
        <QuestionnaireItem name="role" required>
          <h2>What is your role?</h2>
          <QuestionnaireChoices>{choices}</QuestionnaireChoices>
        </QuestionnaireItem>
      why: >-
        A heading does not name the fieldset, so the choices are announced
        without the question they answer.

family_membership:
  name: questionnaire
  role: part

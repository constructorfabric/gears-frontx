# Semantic overlay for QuestionnaireSkip - a part of the Questionnaire family,
# see questionnaire.contract.yaml's `family_membership`. It renders the kit
# Button unless `render` replaces it.
component: questionnaire-skip

intent: Deliberately leave the current optional item of a Questionnaire unanswered and move on.

typical_uses:
  - The way past an optional question the user declines to answer

dont_use_when:
  - situation: An action button outside a questionnaire
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1

# Children replace the default "Skip" text.
accepts:
  content: specified
  text: true

invariants:
  - id: variant-and-size-style-the-default-button
    text: >-
      `variant` and `size` are passed to the kit Button the component
      renders by default; when `render` is given it replaces that Button and
      both are ignored.
  - id: hidden-when-it-does-not-apply
    text: >-
      It is hidden whenever the current item is required. While hidden it
      carries the native `hidden` and `inert` attributes, `aria-hidden` and
      tabIndex -1, and `data-hidden` in place of `data-visible`.
  - id: skip-clears-and-advances
    text: >-
      Skipping clears the item's answer, sets its status to `skipped` so it
      submits nothing, and moves to the next item; on the last item it
      submits the form instead.

anti_patterns:
  - dont: Use QuestionnaireSkip to move past a required item
    do_instead: Mark the item optional in both `items` and QuestionnaireItem; a required item has no skip path

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: questionnaire.test.tsx asserts Skip has the hidden property on a required item, and that a skipped item is absent from the submitted FormData
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      The questionnaire engine's render prop takes an element or a function
      of the button's own state (`QuestionnaireNavigationState`: disabled,
      shortcut, status, visible), so its type is a union of a React element
      and a callback; the compiler emits one JSON type per property, so
      nothing is asserted. The kit defaults it to its own Button.

examples:
  good:
    - title: The default Skip button
      code: <QuestionnaireSkip />
    - title: A ghost Skip button with its own text
      code: <QuestionnaireSkip variant="ghost">Not now</QuestionnaireSkip>
  bad:
    - title: Skip mounted only for optional items
      code: "{!required && <QuestionnaireSkip />}"
      why: >-
        Skip already hides itself on a required item; a hand-written
        condition repeats state the root reads from `items` and drifts from
        it when the two disagree.

family_membership:
  name: questionnaire
  role: part

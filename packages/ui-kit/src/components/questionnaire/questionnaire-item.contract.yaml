# Semantic overlay for QuestionnaireItem - a part of the Questionnaire
# family, see questionnaire.contract.yaml's `family_membership`.
component: questionnaire-item

intent: One question of a Questionnaire, a fieldset that is shown and interactive only while it is the current item.

typical_uses:
  - A single-choice question
  - A multiple-choice question (`multiple`)
  - A short freeform answer

dont_use_when:
  - situation: A group of related fields shown together in an ordinary form
    instead:
      target: FieldSet
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field_set.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_title.v1 # QuestionnaireTitle
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_description.v1 # QuestionnaireDescription
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_choices.v1 # QuestionnaireChoices
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_input.v1 # QuestionnaireInput, an item with no choices
    - gts.frontx.uikit._.component.v1~frontx.uikit._.questionnaire_error.v1 # QuestionnaireError

invariants:
  - id: hidden-and-inert-unless-current
    text: >-
      Every rendered item stays mounted; all but the current one carry the
      native `hidden` and `inert` attributes, and a `disabled` item is
      always hidden; it is left out of navigation and progress when its
      `items` entry is disabled too, or when the root has no `items`.
  - id: status-follows-the-answer
    text: >-
      The status is `answered` once an enabled choice is checked or the
      freeform field holds non-blank text, `skipped` after
      QuestionnaireSkip, and `unanswered` otherwise; it is stamped as
      `data-status`, and `onStatusChange` is called with each new value.
  - id: passes-when-answered-or-skipped
    text: >-
      The item passes validation when answered, or when it is optional and
      skipped; an untouched optional item fails exactly like a required
      one. `invalid` fails it even when answered, until an optional item is
      skipped.
  - id: one-answer-unless-multiple
    text: >-
      Without `multiple` the choices are radios and the item holds one
      answer: a checked choice and a filled freeform field replace each
      other. With `multiple` every choice is a checkbox and any number may
      be checked.
  - id: name-is-the-form-field
    text: >-
      `name` matches the item's `items` entry and is the form field name its
      answer submits under; a skipped item submits nothing under it.

anti_patterns:
  - dont: Give a QuestionnaireItem a `required` or `disabled` that differs from its `items` entry
    do_instead: >-
      Keep both in step. The root reads the entry for Skip's visibility and
      the flow, while the item's own props decide its validation and Skip's
      effect, so a mismatch shows a Skip that does nothing or hides one an
      optional item needs
  - dont: Omit QuestionnaireError from an optional item
    do_instead: >-
      Render a QuestionnaireError in every item; Next never disables itself,
      so a failed Next on an untouched optional item is otherwise silent

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      questionnaire.test.tsx asserts the inactive item's fieldset has the
      hidden property and the inert attribute, and that the current item
      carries data-status "unanswered" after a blocked Next
  rtl:
    outcome: unknown

prop_statements:
  onStatusChange:
    states: onStatusChange is a callback, not a value
    because: >-
      A function type has no JSON Schema representation. It is
      `(status: 'unanswered' | 'answered' | 'skipped') => void`.

examples:
  good:
    - title: A required single-choice item
      code: |
        <QuestionnaireItem name="role" required>
          <QuestionnaireTitle>What is your role?</QuestionnaireTitle>
          <QuestionnaireDescription>Pick one.</QuestionnaireDescription>
          <QuestionnaireChoices>
            <QuestionnaireChoice value="engineer">Engineer</QuestionnaireChoice>
            <QuestionnaireChoice value="designer">Designer</QuestionnaireChoice>
          </QuestionnaireChoices>
          <QuestionnaireError />
        </QuestionnaireItem>
    - title: An optional freeform item
      code: |
        <QuestionnaireItem name="notes">
          <QuestionnaireTitle>Anything else?</QuestionnaireTitle>
          <QuestionnaireInput placeholder="Optional notes" />
          <QuestionnaireError />
        </QuestionnaireItem>
  bad:
    - title: Required on the item but not in items
      code: |
        <Questionnaire items={[{ name: 'role', choices: [{ value: 'engineer' }] }]}>
          <QuestionnaireItem name="role" required>{question}</QuestionnaireItem>
        </Questionnaire>
      why: >-
        The root reads `required` from the `items` entry, so it shows Skip,
        while the item's own `required` makes that Skip do nothing.

family_membership:
  name: questionnaire
  role: part

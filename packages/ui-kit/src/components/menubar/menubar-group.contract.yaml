# Semantic overlay for MenubarGroup - a part of the Menubar family, see
# menubar.contract.yaml's `family_membership` for how the contracts relate.
# MenubarGroup is DropdownMenuGroup re-exported under this name, so its
# behaviour and its styling in dropdown-menu.module.css are that part's. The
# forwarded surface is the primitive's div.
component: menubar-group

intent: A set of related items in a MenubarMenu, labelled for assistive technology by the MenubarLabel inside it.

typical_uses:
  - A captioned section of a menu, such as the recent documents in a File menu

dont_use_when:
  - situation: A set of mutually exclusive options of which one is chosen
    instead:
      target: MenubarRadioGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_radio_group.v1
  - situation: A visual break between items with no caption
    instead:
      target: MenubarSeparator
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_separator.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_label.v1 # MenubarLabel
    - gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_item.v1 # MenubarItem
    - gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_checkbox_item.v1 # MenubarCheckboxItem
    - gts.frontx.uikit._.component.v1~frontx.uikit._.menubar_sub.v1 # MenubarSub

invariants:
  - id: named-by-its-label
    text: >-
      The group renders `role="group"` and takes its accessible name from the
      MenubarLabel inside it, through `aria-labelledby`, unless the
      caller passes its own `aria-labelledby`; a group with neither has no
      name.
  - id: no-styling-of-its-own
    text: >-
      dropdown-menu.module.css gives the group no class; it adds no spacing
      or divider around its items.

anti_patterns: []

deprecations: {}

# menubar.test.tsx renders no group; nothing asserts the group role or its
# aria-labelledby.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  children:
    states: children is the group's label and rows
    because: >-
      `React.ReactNode` is a union of elements, strings, numbers, fragments
      and more; the compiler emits one JSON type per property.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the group's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the group's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (an empty object for a group). The compiler emits one JSON type per property, so nothing is asserted; the kit's own
      styling goes through dropdown-menu.module.css, not through this.

examples:
  good:
    - title: A captioned group of account entries
      code: |
        <MenubarContent>
          <MenubarGroup>
            <MenubarLabel>Account</MenubarLabel>
            <MenubarItem>Profile</MenubarItem>
            <MenubarItem>Billing</MenubarItem>
          </MenubarGroup>
        </MenubarContent>
  bad:
    - title: Radio items grouped by a plain group
      code: |
        <MenubarGroup>
          <MenubarRadioItem value="list">List</MenubarRadioItem>
          <MenubarRadioItem value="grid">Grid</MenubarRadioItem>
        </MenubarGroup>
      why: >-
        A radio item reads its selection from the MenubarRadioGroup
        around it and the primitive throws when there is none; a plain group
        holds no value.

family_membership:
  name: menubar
  role: part

# Semantic overlay for DialogTitle - a part of the Dialog family, see
# dialog.contract.yaml's `family_membership` for how the contracts relate.
component: dialog-title

intent: The heading that gives its Dialog's popup its accessible name.

typical_uses:
  - The one heading of a dialog, stating the task it holds

dont_use_when:
  - situation: The heading of a card on the page
    instead:
      target: CardTitle
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.card_title.v1

# `mounted_in` is filled from DialogHeader's accepted components; the
# title's own text arrives through children.
accepts:
  content: specified
  text: true

invariants:
  - id: heading-level-two
    text: >-
      DialogTitle renders an h2 set in the heading-2 type ramp with no
      margin.

anti_patterns:
  - dont: Render a second DialogTitle in the same popup
    do_instead: >-
      Keep one DialogTitle per dialog and use plain headings for any
      subheadings; the popup's `aria-labelledby` points at one title's id

deprecations: {}

# dialog.test.tsx asserts only the title's kit class; nothing asserts the
# popup's aria-labelledby.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      title's state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property; the primitive passes an
      empty state object.
  style:
    states: style accepts a function as well as a plain style object; the primitive passes that function an empty state object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)`, and the title's state
      carries no fields. The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes through
      dialog.module.css, not through this.

examples:
  good:
    - title: A title in the header
      code: |
        <DialogHeader>
          <DialogTitle>Delete project</DialogTitle>
        </DialogHeader>
  bad:
    - title: A plain heading in place of DialogTitle
      code: |
        <DialogContent>
          <h2>Delete project</h2>
        </DialogContent>
      why: >-
        A plain heading carries no id the primitive knows about, so the
        popup gets no `aria-labelledby` and a screen reader announces an
        unnamed dialog.

family_membership:
  name: dialog
  role: part

# Semantic overlay for DialogFooter - a part of the Dialog family, see
# dialog.contract.yaml's `family_membership` for how the contracts relate.
component: dialog-footer

intent: The action row at the bottom of a DialogContent, staying pinned while the popup scrolls.

typical_uses:
  - A cancel action beside the action that completes the dialog's task

dont_use_when:
  - situation: The action row of a card on the page
    instead:
      target: CardFooter
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.card_footer.v1

# DialogFooter examines nothing about its children; it lays out buttons,
# DialogClose actions or anything else in one row.
accepts:
  content: unconstrained

invariants:
  - id: stacks-narrow-row-from-640px
    text: >-
      Below 640px DialogFooter stacks its children in a column in reverse
      source order, so the last child sits on top; from 640px up it lays
      them out in a row aligned to the end, spaced var(--space-2) apart
      either way.
  - id: pinned-while-the-popup-scrolls
    text: >-
      DialogFooter is sticky at the bottom of its scroll container with the
      popup's own opaque background, so as a direct child of DialogContent
      it stays in view and masks the content scrolling under it.

anti_patterns:
  - dont: Order the footer's actions with the primary action first
    do_instead: >-
      Put the cancel action first and the primary action last; the row ends
      with the last child and the narrow column shows it on top

deprecations: {}

# A plain div with no role; dialog.test.tsx renders it but asserts nothing
# about it.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Cancel and confirm
      code: |
        <DialogFooter>
          <DialogClose render={<Button variant="outline" />}>Cancel</DialogClose>
          <Button onClick={handleInvite}>Send invitations</Button>
        </DialogFooter>
  bad:
    - title: The primary action first
      code: |
        <DialogFooter>
          <Button onClick={handleInvite}>Send invitations</Button>
          <DialogClose render={<Button variant="outline" />}>Cancel</DialogClose>
        </DialogFooter>
      why: >-
        The row ends with Cancel, and on a narrow screen the reversed column
        puts Cancel above the primary action.

family_membership:
  name: dialog
  role: part

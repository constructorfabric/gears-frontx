# Semantic overlay for CalendarDayButton - the day button Calendar renders
# through its `components.DayButton` slot, exported so a replacement
# DayButton can compose it. It is not a child of Calendar in the React
# tree, so it forms no family with it; its one mount point is stated below.
component: calendar-day-button

intent: The button inside each day cell of a Calendar, carrying the selection state as data attributes and taking focus when keyboard navigation lands on its day.

typical_uses:
  - The inner element of a custom DayButton passed through Calendar's `components`, which adds content or behaviour around the kit's day button

dont_use_when:
  - situation: A button anywhere outside a Calendar's day grid
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1

mounted_in:
  - container: >-
      a custom DayButton passed as `components={{ DayButton }}` to Calendar,
      which receives the library's day button props and forwards them
    note: >-
      Calendar already renders CalendarDayButton for every day once `mode`
      or `onDayClick` is set; it is
      rendered by hand only inside such a replacement, with the `day` and
      `modifiers` the replacement received.

accepts:
  content: specified
  text: true

invariants:
  - id: selection-data-attributes
    text: >-
      The button carries `data-selected-single` for a selected day outside
      any range, and `data-range-start`, `data-range-end` and
      `data-range-middle` for the parts of a range, all derived from
      `modifiers`; calendar.module.css keys the selection fill on them.
  - id: focus-follows-modifiers
    text: >-
      When `modifiers.focused` becomes true the button moves the browser's
      focus onto itself; this is how arrow-key navigation reaches it.
  - id: day-stays-off-the-dom
    text: >-
      `day` is read and dropped, never written to the button as an
      attribute; the ISO date is on the surrounding cell's `data-day`.

anti_patterns:
  - dont: Render CalendarDayButton without the `day` and `modifiers` a DayButton slot receives
    do_instead: Forward every prop the replacement DayButton received, so the selection attributes and focus handling have their source

deprecations: {}

# calendar.test.tsx asserts data-selected-single, data-range-start,
# data-range-end and data-range-middle on day buttons; nothing about
# accessibility of the button itself, whose label and tabindex come from the
# props the library passes.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  day:
    states: day is the library's CalendarDay object for the button's day
    because: >-
      `CalendarDay` is a class instance holding the date, the displayed
      month and whether the day is outside it; the compiler leaves the
      named type to tsc.
  modifiers:
    states: modifiers is an object mapping each modifier name to whether it applies to the day, such as selected, focused, range_start or disabled
    because: >-
      `Modifiers` is `Record<string, boolean>` keyed by the library's and
      the caller's modifier names; the compiler leaves the named type to
      tsc.

examples:
  good:
    - title: A replacement DayButton that marks days with events and keeps the kit's button
      code: |
        function EventDayButton(props: DayButtonProps) {
          return (
            <CalendarDayButton {...props}>
              {props.children}
              {hasEvent(props.day.date) && <span aria-hidden="true">*</span>}
            </CalendarDayButton>
          );
        }
        <Calendar mode="single" selected={date} onSelect={setDate} components={{ DayButton: EventDayButton }} />
  bad:
    - title: A day button rendered by hand without the slot's props
      code: <CalendarDayButton>15</CalendarDayButton>
      why: >-
        `day` and `modifiers` are required and come from the Calendar's
        DayButton slot; without `modifiers` the component throws reading
        `modifiers.focused`.

# Semantic overlay for KbdGroup - the other contract of this directory, see
# kbd.contract.yaml. The two form no family; this overlay's `accepts` is the
# one statement of how they nest.
#
# Machine-extractable facts do NOT belong here. KbdGroup declares no
# kit-specific props either: every prop is the native kbd element's, carried
# by the same element surface Kbd names.
component: kbd-group

intent: Group several key caps into one chorded shortcut so they read as pressed together.

typical_uses:
  - A chord at the end of a menu item or tooltip (Ctrl + K opens the palette)
  - A shortcut hint under an empty state (Space to preview)

# A single key has nothing to group. Keys listed as alternatives or in a
# legend are not one chord either - each stands on its own in the text.
dont_use_when:
  - situation: A single key with nothing to group
    instead:
      target: Kbd
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.kbd.v1
  - situation: Keys listed as alternatives or in a legend rather than pressed together
    instead:
      target: separate Kbd elements, each placed in the surrounding text
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.kbd.v1

# The ONE authored statement of the directory's nesting: a group hosts Kbd
# elements. The Kbd contract's `mounted_in` is filled from this list by the
# compiler, so the two directions cannot disagree.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.kbd.v1 # Kbd

invariants:
  - id: gap-only-separation
    text: >-
      KbdGroup separates its children with a fixed visual gap and nothing
      else - there is no separator glyph and no prop to add one.

anti_patterns:
  - dont: Put plain text keys inside a group expecting spacing between them
    do_instead: >-
      Give each key its own Kbd - the gap applies between the Kbd elements,
      while contiguous text collapses into one unspaced run

# None yet.
deprecations: {}

# One outcome per claim. "failed" (looked at, does not hold) and "unknown"
# (nobody looked) are different answers - say which. kbd.test.tsx asserts
# the tag, the class merge and the nesting of its Kbds only, nothing about
# how assistive tech reads the chord.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

# Canonical snippets. `good` is what to copy, `bad` is what generation
# actually produces when it guesses; every `bad` states why.
examples:
  good:
    - title: A chorded shortcut
      code: |
        <KbdGroup>
          <Kbd>Ctrl</Kbd>
          <Kbd>K</Kbd>
        </KbdGroup>
  bad:
    - title: A separator prop guessed from an older library version
      code: |
        <KbdGroup separator="+">
          <Kbd>Ctrl</Kbd>
          <Kbd>K</Kbd>
        </KbdGroup>
      why: >-
        KbdGroup takes no kit-specific props; the visual gap is fixed
        styling and there is no separator prop - every prop here is the
        native kbd element's.
    - title: One key alone
      code: <KbdGroup>Esc</KbdGroup>
      why: >-
        A group exists to space several keys apart; a single key is what
        Kbd itself renders, and the group carries none of the key-cap
        styling on its own.

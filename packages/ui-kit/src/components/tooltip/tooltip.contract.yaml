# Semantic overlay for Tooltip (the root) - the hand-written half of one of
# three contracts describing this compound component. See
# tooltip-trigger.contract.yaml and tooltip-content.contract.yaml for the
# rest of the family, and `family_membership` below for how a reader walks
# between them. TooltipProvider shares this directory but is not a part of
# the family: it wraps any number of Tooltip roots, see
# tooltip-provider.contract.yaml.
#
# Machine-extractable facts (prop list, forwarded surface) do NOT belong
# here: the compiler takes those from tooltip.tsx and the Base UI Tooltip
# primitive it re-exports. The root renders no element of its own, so it
# names no element surface.
component: tooltip

intent: Hold the open state of one tooltip and tie its trigger to the short visual hint that trigger shows on hover or keyboard focus.

typical_uses:
  - A short label for an icon-only control
  - The full text behind a truncated label

dont_use_when:
  - situation: Information a user needs to complete the task
    instead:
      target: visible text on the page, next to the control
      note: >-
        A tooltip is supplementary: hovering opens it for mouse pointers
        only, and nothing links its text to the trigger for assistive
        technology, so touch and screen-reader users may never receive it.
  - situation: A floating panel the user interacts with (links, buttons, form fields)
    instead:
      target: Popover
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.popover.v1
  - situation: A preview of what a link points to, opened by hovering the link
    instead:
      target: HoverCard
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.hover_card.v1
  - situation: A list of actions anchored to a trigger
    instead:
      target: DropdownMenu
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu.v1

# The ONE authored statement of the family's nesting: the compiler fills the
# trigger's and the content's `mounted_in` from this list.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.tooltip_trigger.v1 # TooltipTrigger
    - gts.frontx.uikit._.component.v1~frontx.uikit._.tooltip_content.v1 # TooltipContent

invariants:
  - id: open-wins-over-default-open
    text: >-
      `open` and `defaultOpen` are both accepted; `defaultOpen` seeds the
      initial state and is ignored afterwards, and when `open` is given it
      wins and the component follows it on every render.
  - id: no-aria-link-to-the-trigger
    text: >-
      The root wires no ARIA relationship between trigger and popup: the
      trigger receives no `aria-describedby` and the popup no `tooltip`
      role, so the popup's text is not announced as the trigger's name or
      description.
  - id: disabled-closes-and-blocks-every-trigger
    text: >-
      `disabled` on the root closes a tooltip that is open and keeps every
      trigger of this root from opening it, except a trigger that passes its
      own `disabled`, which takes precedence over the root's.

anti_patterns:
  - dont: Leave an icon-only trigger without an accessible name, counting on the tooltip text to name it
    do_instead: >-
      Give the trigger an `aria-label` (or visible text) that matches the
      tooltip's content, so every user receives the same message

deprecations: {}

# tooltip.test.tsx asserts hover, focus and disabled open behaviour and the
# trigger's button role; nothing in it asserts how assistive technology
# reads the tooltip, and the primitive wires no ARIA link to assert.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

# What each property the schema cannot state in full actually states, and
# why - the compiler emits both halves into that property's description.
prop_statements:
  children:
    states: children is the root's content, either React nodes or a function of the active trigger's payload that returns them
    because: >-
      `React.ReactNode | PayloadChildRenderFunction<Payload>` - the function
      form receives `{ payload }` from whichever trigger opened the tooltip.
      The compiler emits one JSON type per property, and a function has no JSON Schema representation.
  onOpenChange:
    states: onOpenChange is a callback called with the next open state and event details, not a value
    because: >-
      `(open: boolean, eventDetails) => void`; the second argument carries
      Base UI's change-event details, including the reason (such as a
      trigger hover, focus or press, an outside press or Escape). No JSON
      Schema type covers a function.
  onOpenChangeComplete:
    states: onOpenChangeComplete is a callback called with the open state once the open or close animation has finished
    because: >-
      `(open: boolean) => void` - a function, which no JSON Schema type
      covers.
  actionsRef:
    states: actionsRef is a ref the root fills with imperative `close` and `unmount` actions
    because: >-
      `React.RefObject<TooltipRootActions | null>` - a ref object holding
      functions, which no JSON Schema type covers.
  handle:
    states: handle is an opaque object from the primitive's Tooltip.createHandle(), shared with a trigger placed outside this root
    because: >-
      `TooltipHandle<Payload>` is a class instance holding the tooltip's
      store, not data; the kit re-exports no createHandle, so a caller
      imports it from the primitive.
  triggerId:
    states: triggerId is the id of the trigger a controlled tooltip is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.
  defaultTriggerId:
    states: defaultTriggerId is the id of the trigger an initially open tooltip is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.

examples:
  good:
    - title: A labelled icon-only trigger with its hint
      code: |
        <Tooltip>
          <TooltipTrigger aria-label="Bold">
            <BoldIcon />
          </TooltipTrigger>
          <TooltipContent>Bold</TooltipContent>
        </Tooltip>
    - title: A kit Button as the trigger element
      code: |
        <Tooltip>
          <TooltipTrigger render={<Button variant="outline">Save</Button>} />
          <TooltipContent>Save changes</TooltipContent>
        </Tooltip>
  bad:
    - title: An icon-only trigger named only by its tooltip
      code: |
        <Tooltip>
          <TooltipTrigger>
            <BoldIcon />
          </TooltipTrigger>
          <TooltipContent>Bold</TooltipContent>
        </Tooltip>
      why: >-
        The tooltip's text is not wired to the trigger for assistive
        technology, so a screen reader announces an unnamed button.

family_membership:
  name: tooltip
  role: root

# Semantic overlay for TooltipTrigger - a part of the Tooltip family, see
# tooltip.contract.yaml's `family_membership` for how the three contracts
# relate.
component: tooltip-trigger

intent: The button whose hover or keyboard focus opens its Tooltip's hint.

typical_uses:
  - The control a Tooltip describes, such as an icon-only toolbar button

dont_use_when:
  - situation: A button with no hint attached to it
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1

# `mounted_in` is filled from the Tooltip root's accepted components, not
# authored here. The trigger's own caption and any glyph arrive through
# children; with `render`, the rendered element brings its own.
accepts:
  content: specified
  text: true

invariants:
  - id: disabled-suppresses-the-tooltip-not-the-button
    text: >-
      `disabled` stops this trigger from opening the tooltip and stamps
      `data-trigger-disabled`; it does not set the native `disabled`
      attribute, so the button stays focusable and clickable.
  - id: hover-opens-for-mouse-pointers-focus-for-keyboard
    text: >-
      Hovering opens the tooltip for mouse pointers only, after the pointer
      rests on the trigger for the open delay; keyboard focus on the trigger
      opens it as well.

anti_patterns:
  - dont: Pass `disabled` to make the button itself inert
    do_instead: >-
      Use `disabled` only to suppress the tooltip; to disable the element,
      give the rendered element its own native `disabled` through `render`,
      as the primitive's own prop documentation directs

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Tooltip.Trigger renders a native button; tooltip.test.tsx
      asserts getByRole('button', { name: 'Hover me' }) on it and that focusing
      it opens the tooltip ("opens on trigger focus")
  rtl:
    outcome: unknown

prop_statements:
  handle:
    states: handle is an opaque object from the primitive's Tooltip.createHandle(), tying this trigger to a Tooltip root it is not placed inside
    because: >-
      `TooltipHandle<Payload>` is a class instance holding the tooltip's
      store, not data; the kit re-exports no createHandle, so a caller
      imports it from the primitive.
  payload:
    states: payload is any value handed to the root's function children when this trigger opens the tooltip
    because: >-
      Typed by the caller's own `Payload` type parameter (`unknown` here), so
      no JSON Schema type can state what it holds.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the trigger's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the trigger's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (open). The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes
      through tooltip.module.css, not through this.

examples:
  good:
    - title: The kit's Button rendered as the trigger
      code: |
        <Tooltip>
          <TooltipTrigger render={<Button variant="ghost">Share</Button>} />
          <TooltipContent>Share with your team</TooltipContent>
        </Tooltip>
    - title: A trigger that opens sooner than the default
      code: |
        <Tooltip>
          <TooltipTrigger delay={200} aria-label="Settings">
            <SettingsIcon />
          </TooltipTrigger>
          <TooltipContent>Settings</TooltipContent>
        </Tooltip>
  bad:
    - title: A kit Button nested inside the trigger
      code: |
        <Tooltip>
          <TooltipTrigger>
            <Button variant="ghost">Share</Button>
          </TooltipTrigger>
          <TooltipContent>Share with your team</TooltipContent>
        </Tooltip>
      why: >-
        The trigger already renders a native button, so this nests a button
        inside a button, which HTML does not allow; pass the Button through
        `render` instead.

family_membership:
  name: tooltip
  role: part

# Semantic overlay for TooltipProvider - a directory neighbour of the
# Tooltip family, not a part of it. A provider wraps any subtree and groups
# every Tooltip below it at any depth; it renders no element, and no Tooltip
# requires one, so it stands on its own contract with no family membership.
component: tooltip-provider

intent: Share the open delay across every tooltip in a subtree and group them, so once one opens its neighbours open instantly.

typical_uses:
  - A toolbar or icon rail whose triggers all carry tooltips
  - Once near the application root, grouping every tooltip below it

dont_use_when:
  - situation: A tooltip that should keep the primitive's standard hover delay
    instead:
      target: Tooltip
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.tooltip.v1
      note: >-
        Mount the Tooltip without a provider around it; inside one, the
        kit's default provider delay of 0 opens it with no wait.

# The provider renders its children unchanged and groups tooltips through
# context at any depth, so nothing about its direct children is constrained.
accepts:
  content: unconstrained

invariants:
  - id: renders-no-element
    text: >-
      TooltipProvider renders no DOM element; it only provides context to
      every Tooltip below it.
  - id: default-delay-opens-instantly
    text: >-
      Left at its default `delay` of 0, every tooltip inside opens with no
      wait and a TooltipTrigger's own `delay` is ignored; with a non-zero
      `delay` here, a trigger's own `delay` takes precedence over it.
  - id: neighbours-open-instantly-within-timeout
    text: >-
      Once one tooltip inside has opened, another one opened within
      `timeout` milliseconds of the previous closing opens with no delay and
      without its open transition.

anti_patterns:
  - dont: Wrap each Tooltip in its own TooltipProvider
    do_instead: >-
      Wrap the whole group in one provider - each tooltip joins the nearest
      provider above it, so separate providers form separate groups

deprecations: {}

# The provider renders nothing and wires no ARIA; tooltip.test.tsx asserts
# its open-delay behaviour only.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  children:
    states: children is any React content; every Tooltip inside it, at any depth, joins the group
    because: >-
      `React.ReactNode` is a union of elements, strings, numbers, fragments
      and more, which the compiler cannot state as one JSON type.

examples:
  good:
    - title: A toolbar whose tooltips open as a group
      code: |
        <TooltipProvider>
          <Tooltip>
            <TooltipTrigger aria-label="Bold">
              <BoldIcon />
            </TooltipTrigger>
            <TooltipContent>Bold</TooltipContent>
          </Tooltip>
          <Tooltip>
            <TooltipTrigger aria-label="Italic">
              <ItalicIcon />
            </TooltipTrigger>
            <TooltipContent>Italic</TooltipContent>
          </Tooltip>
        </TooltipProvider>
    - title: A group that waits before its first tooltip opens
      code: |
        <TooltipProvider delay={600}>
          <nav aria-label="Formatting">{children}</nav>
        </TooltipProvider>
  bad:
    - title: A per-trigger delay expected to slow a default provider
      code: |
        <TooltipProvider>
          <Tooltip>
            <TooltipTrigger delay={600}>Share</TooltipTrigger>
            <TooltipContent>Share with your team</TooltipContent>
          </Tooltip>
        </TooltipProvider>
      why: >-
        Under a provider at its default delay of 0 the trigger's own `delay`
        is ignored and the tooltip opens with no wait; set `delay` on the
        provider instead.

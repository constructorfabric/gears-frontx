# Semantic overlay for NavigationMenu (the root) - the hand-written half of
# one of nine contracts describing this compound component. The parts are the
# other navigation-menu-*.contract.yaml files in this directory; see
# `family_membership` below for how a reader walks between them.
#
# Machine-extractable facts (prop list, defaults) do NOT belong here: the
# compiler takes those from navigation-menu.tsx and the Base UI
# NavigationMenu.Root and Positioner it wraps. This file carries only what the
# code cannot express.
component: navigation-menu

intent: A site or application navigation bar whose entries are plain links or triggers that expand into a shared panel of links.

typical_uses:
  - The primary horizontal navigation of a site or application, mixing direct links with entries that open a panel of links
  - A vertical navigation column

dont_use_when:
  - situation: A menu of actions opened from a button, such as a "more actions" button on a row
    instead:
      target: DropdownMenu
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu.v1
  - situation: A persistent row of application menus of commands, such as File, Edit and View
    instead:
      target: Menubar
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.menubar.v1
  - situation: Switching between panels that share one screen, with no change of page
    instead:
      target: Tabs
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.tabs.v1
  - situation: Showing the path from the top of a hierarchy to the current page
    instead:
      target: Breadcrumb
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.breadcrumb.v1
  - situation: A persistent, collapsible side panel holding the application's navigation
    instead:
      target: Sidebar
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar.v1

# The ONE authored statement of the root's nesting: the compiler fills the
# list's `mounted_in` from this. The viewport is not here: the root renders
# it itself.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.navigation_menu_list.v1 # NavigationMenuList

invariants:
  - id: value-wins-over-default-value
    text: >-
      `value` and `defaultValue` are both accepted; `defaultValue` seeds the
      initial state and is ignored afterwards, and when `value` is given it
      wins and the component follows it on every render.
  - id: open-while-value-is-set
    text: >-
      The menu is open exactly while its value is non-null, and the open item
      is the NavigationMenuItem whose `value` equals it; setting the value to
      null closes the menu.
  - id: one-shared-popup
    text: >-
      The root renders the menu's one popup after its children, so the
      placement props (`side`, `sideOffset`, `align`, `alignOffset`,
      `positionMethod`, `collisionBoundary`, `collisionPadding`) and
      `container` sit on the root, not on a content.
  - id: renders-nav-unless-nested
    text: >-
      The root renders a `nav` element; a NavigationMenu nested inside another
      NavigationMenu's content renders a `div` instead.
  - id: escape-and-outside-click-close
    text: >-
      While open, pressing Escape or clicking outside the menu closes it and
      reports the change through `onValueChange`.
  - id: portals-to-body-unless-container
    text: >-
      Without `container`, the shared popup portals into the node of the
      nearest enclosing portal, or the document body when there is none; a
      theme scoped to a subtree reaches the popup only when that subtree, or a
      node inside it, is passed as `container`.

anti_patterns:
  - dont: Hold the value in the caller and pass `value` without `onValueChange`
    do_instead: >-
      Pass `onValueChange` alongside `value` and update the state from it, or
      leave both out; a controlled value that nothing updates keeps every
      trigger from opening or closing the menu
  - dont: Keep the default positioning when the menu sits inside a transformed or filtered container
    do_instead: >-
      Pass `positionMethod="fixed"` on the root; absolute positioning resolves
      against the transformed container and misplaces the popup

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's NavigationMenu.Root renders a nav landmark and closes on
      Escape and on an outside click; navigation-menu.test.tsx's "closes on
      Escape" and "closes on an outside click" assert the open content leaves
      the DOM
  rtl:
    outcome: unknown

prop_statements:
  value:
    states: value is the open item's value, of the caller's own type, or null when the menu is closed
    because: >-
      `Value | null`, where `Value` is the root's own generic parameter -
      compared by identity against each NavigationMenuItem's `value`, so no
      JSON Schema type can state what a caller's identifier looks like.
  defaultValue:
    states: defaultValue is the same caller-typed value as value, or null, seeding the initially open item
    because: >-
      Same `Value | null` type as `value` above, compared by identity against
      each item's own `value`; no schema can state what a caller's own
      identifier looks like.
  onValueChange:
    states: onValueChange is a callback called with the next open item's value, or null on close, and event details, not a value
    because: >-
      `(value: Value | null, eventDetails) => void`; the second argument
      carries Base UI's change-event details, including the reason (such as
      a trigger press or hover, an outside press, Escape or a link press). No
      JSON Schema type covers a function.
  onOpenChangeComplete:
    states: onOpenChangeComplete is a callback called with the open state once the close animation has finished
    because: >-
      `(open: boolean) => void` - a function, which no JSON Schema type
      covers.
  actionsRef:
    states: actionsRef is a ref the root fills with an imperative `unmount` action
    because: >-
      `React.RefObject<NavigationMenuRoot.Actions | null>` - a ref object
      holding a function, which no JSON Schema type covers. Passing it opts
      into manual unmounting after close.
  container:
    states: container is the DOM node, shadow root or ref to one that the shared popup portals into
    because: >-
      `HTMLElement | ShadowRoot | RefObject<HTMLElement | ShadowRoot | null> | null`
      - live DOM nodes and ref objects, which no JSON Schema type covers. An
      explicit null holds the popup back until a container is given; leave
      the prop out for the default.
  sideOffset:
    states: sideOffset is the gap in pixels between the open trigger and the popup, as a number or a function of side, align and both boxes' sizes
    because: >-
      `number | OffsetFunction` - the compiler emits one JSON type per
      property, and the function form has no JSON Schema representation.
  alignOffset:
    states: alignOffset is the shift in pixels along the alignment axis, as a number or a function of side, align and both boxes' sizes
    because: >-
      `number | OffsetFunction` - the compiler emits one JSON type per
      property, and the function form has no JSON Schema representation.
  collisionBoundary:
    states: collisionBoundary is the area the popup is kept inside, `clipping-ancestors`, an element, a list of elements or a rectangle
    because: >-
      `'clipping-ancestors' | Element | Element[] | Rect` mixes a string with
      live DOM elements, which no JSON Schema type covers.
  collisionPadding:
    states: collisionPadding is the space in pixels kept from the collision boundary, one number or a per-side object
    because: >-
      `number | { top?, right?, bottom?, left? }` - the compiler emits one
      JSON type per property.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the root's own
      state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the root's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (open, nested). The compiler emits one JSON type per property, so nothing is asserted; the kit's own
      styling goes through navigation-menu.module.css, not through this.

examples:
  good:
    - title: A trigger with a panel of links beside a direct link
      code: |
        <NavigationMenu>
          <NavigationMenuList>
            <NavigationMenuItem>
              <NavigationMenuTrigger>Products</NavigationMenuTrigger>
              <NavigationMenuContent>
                <NavigationMenuLink href="/products/a">Product A</NavigationMenuLink>
                <NavigationMenuLink href="/products/b">Product B</NavigationMenuLink>
              </NavigationMenuContent>
            </NavigationMenuItem>
            <NavigationMenuItem>
              <NavigationMenuLink className={navigationMenuTriggerStyle()} href="/pricing">
                Pricing
              </NavigationMenuLink>
            </NavigationMenuItem>
          </NavigationMenuList>
        </NavigationMenu>
    - title: A menu inside a themed, transformed section
      code: |
        <NavigationMenu positionMethod="fixed" container={themedSectionRef} align="center">
          <NavigationMenuList>
            <NavigationMenuItem>
              <NavigationMenuTrigger>Docs</NavigationMenuTrigger>
              <NavigationMenuContent>
                <NavigationMenuLink href="/docs/start">Getting started</NavigationMenuLink>
              </NavigationMenuContent>
            </NavigationMenuItem>
          </NavigationMenuList>
        </NavigationMenu>
  bad:
    - title: Placement passed to the content, as a dropdown menu takes it
      code: |
        <NavigationMenu>
          <NavigationMenuList>
            <NavigationMenuItem>
              <NavigationMenuTrigger>Products</NavigationMenuTrigger>
              <NavigationMenuContent align="end">
                <NavigationMenuLink href="/products/a">Product A</NavigationMenuLink>
              </NavigationMenuContent>
            </NavigationMenuItem>
          </NavigationMenuList>
        </NavigationMenu>
      why: >-
        Every content shares the root's one popup, so NavigationMenuContent
        takes no placement props; pass `align` to NavigationMenu instead.

family_membership:
  name: navigation_menu
  role: root

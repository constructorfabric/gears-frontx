# Semantic overlay for NavigationMenuTrigger - a part of the NavigationMenu
# family, see navigation-menu.contract.yaml's `family_membership` for how the
# contracts relate. The forwarded surface is the primitive's button.
component: navigation-menu-trigger

intent: The button of a NavigationMenuItem that opens the item's NavigationMenuContent in the menu's shared popup.

typical_uses:
  - A top-level entry, such as Products or Solutions, that expands into a panel of links

dont_use_when:
  - situation: A top-level entry that navigates directly, with no panel behind it
    instead:
      target: NavigationMenuLink
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.navigation_menu_link.v1
      note: >-
        Give the link `className={navigationMenuTriggerStyle()}` to draw it
        like a trigger.
  - situation: A button that opens a menu of actions
    instead:
      target: DropdownMenuTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_trigger.v1

# `mounted_in` is filled from NavigationMenuItem's own accepted components.
# The chevron is not accepted here: the trigger renders one itself.
accepts:
  content: specified
  text: true

invariants:
  - id: renders-its-own-chevron
    text: >-
      The trigger renders a NavigationMenuIcon after its children, a chevron
      that turns over while the item is open, so its children are only the
      caption.
  - id: hover-opens-click-toggles
    text: >-
      Hovering the trigger with a mouse opens its item after the root's
      `delay`; clicking it opens the item, and clicking the open item's
      trigger closes it again unless a hover opened it a moment before;
      ArrowDown in a horizontal menu, or the inline-end arrow key in a
      vertical one, opens it from the keyboard.
  - id: open-item-marked-data-popup-open
    text: >-
      While its item is open the trigger carries `data-popup-open` and keeps
      the hover fill navigation-menu.module.css gives it, so it reads as
      expanded after the pointer moves onto the popup.

anti_patterns: []

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's NavigationMenu.Trigger renders a button with
      aria-expanded; navigation-menu.test.tsx asserts the trigger is found by
      the button role and name, that it carries data-popup-open once clicked,
      and that Escape on it closes the open content
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the trigger's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the trigger's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (open). The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes
      through navigation-menu.module.css, not through this.

examples:
  good:
    - title: A trigger with its content
      code: |
        <NavigationMenuItem>
          <NavigationMenuTrigger>Products</NavigationMenuTrigger>
          <NavigationMenuContent>
            <NavigationMenuLink href="/products/a">Product A</NavigationMenuLink>
          </NavigationMenuContent>
        </NavigationMenuItem>
  bad:
    - title: A chevron added to the caption
      code: |
        <NavigationMenuItem>
          <NavigationMenuTrigger>
            Products
            <NavigationMenuIcon />
          </NavigationMenuTrigger>
          <NavigationMenuContent>
            <NavigationMenuLink href="/products/a">Product A</NavigationMenuLink>
          </NavigationMenuContent>
        </NavigationMenuItem>
      why: >-
        The trigger renders its own NavigationMenuIcon after the children, so
        this draws two chevrons.

family_membership:
  name: navigation_menu
  role: part

# Semantic overlay for RadioGroup (the root) - the hand-written half of one
# of two contracts describing this compound component. See
# radio-group-item.contract.yaml for the other half, and `family_membership`
# below for how a reader (or the conformance test) walks between them.
#
# Machine-extractable facts (prop list, defaults, forwarded surface) do NOT
# belong here: the compiler takes those from radio-group.tsx and the Base UI
# RadioGroup primitive it wraps, and rejects an overlay that tries to
# restate them - one fact, one owner. This file carries only what the code
# cannot express: intent, boundaries, invariants.
component: radio-group

intent: Let a user pick exactly one option from a small visible set, tracked as one shared value.

typical_uses:
  - A short list of mutually exclusive options where every choice stays visible at once (plan tier, delivery method, sort order)

dont_use_when:
  - situation: More options than fit comfortably on screen at once, or the space is constrained
    instead:
      target: Select
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.select.v1
  - situation: Independent options where more than one may be on at once
    instead:
      target: Checkbox
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.checkbox.v1
  - situation: A single on/off setting with no sibling options
    instead:
      target: Switch
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.switch.v1

# The ONE authored statement of a nesting relationship: the compiler fills
# every other contract's `mounted_in` from lists like this one, so the two
# directions cannot disagree.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.radio_group_item.v1 # RadioGroupItem
    - gts.frontx.uikit._.component.v1~frontx.uikit._.label.v1 # Label, the caption beside an item

invariants:
  - id: value-wins-over-default-value
    text: >-
      `value` and `defaultValue` are both accepted; `defaultValue` seeds the
      initial state and is ignored afterwards, and when `value` is given it
      wins and the component follows it on every render.
  - id: disabled-cascades-to-every-item
    text: >-
      Setting `disabled` on the group disables every item inside it; an
      item's own `disabled` can disable that one item further but cannot
      re-enable it against a disabled group.

anti_patterns:
  - dont: Render the group with no accessible name
    do_instead: >-
      Pass `aria-label`, or `aria-labelledby` pointing at a visible heading
      (or at a FieldLegend inside a FieldSet); a `<label htmlFor>` cannot
      name the group, because the group is not a labelable element

deprecations: {}

# One outcome per claim. "failed" (looked at, does not hold) and "unknown"
# (nobody looked) are different answers - say which.
attestations:
  a11y:
    outcome: verified
    by: >-
      Base UI's own RadioGroup primitive (role="radiogroup", arrow-key
      navigation between items, a hidden native input for form submission)
      plus radio-group.test.tsx's own role/aria-checked/data-checked
      assertions
  rtl:
    outcome: unknown

# What each property that reaches this contract asserting nothing (or only
# part of its shape) actually states, and why - keyed on the property
# itself. The compiler emits both halves into that property's own
# description, beside the `TS:` text.
prop_statements:
  value:
    states: value is the root's own generic Value type parameter, not a JSON Schema type
    because: >-
      Base UI's `RadioGroup<Value>` types `value` as `Value | undefined`,
      where `Value` is the caller's own choice - no JSON Schema type can
      state it, only that something is accepted. radio-group.md's example
      uses string item values (`value="free"` on the item), so a group
      value is typically one of those strings.
  defaultValue:
    states: defaultValue is the root's own generic Value type parameter, not a JSON Schema type
    because: >-
      Same generic type as `value` above, unchecked in the same half - the
      uncontrolled starting selection is one of the caller's own `Value`
      type, which no schema can state because the caller chooses it.
  onValueChange:
    states: onValueChange is a callback, not a value
    because: >-
      `(value: Value, eventDetails) => void` - a function of the root's own
      generic `Value` plus Base UI's own event-details object. No JSON
      Schema type covers a function.
  inputRef:
    states: inputRef is a ref to the hidden native input Base UI renders for form submission
    because: >-
      `React.Ref<HTMLInputElement>` is a union of a ref object and a
      callback function - the compiler emits one JSON type per property. It exists
      so a consumer can read or focus the native input directly, the same
      input `name`/`form` submit through.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the group's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the group's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, readOnly, required, ...). The compiler emits one JSON type per property, so nothing is
      asserted; the kit's own styling goes through radio-group.module.css,
      not through this.

examples:
  good:
    - title: Controlled group, each item captioned by a sibling Label
      code: |
        <RadioGroup value={tier} onValueChange={setTier} aria-label="Plan tier">
          <RadioGroupItem value="free" id="tier-free" />
          <Label htmlFor="tier-free">Free</Label>
          <RadioGroupItem value="pro" id="tier-pro" />
          <Label htmlFor="tier-pro">Pro</Label>
          <RadioGroupItem value="enterprise" id="tier-enterprise" disabled />
          <Label htmlFor="tier-enterprise">Enterprise (contact us)</Label>
        </RadioGroup>
    - title: Uncontrolled group with a default selection
      code: |
        <RadioGroup defaultValue="pro" name="tier" aria-label="Plan tier">
          <RadioGroupItem value="free" aria-label="Free" />
          <RadioGroupItem value="pro" aria-label="Pro" />
        </RadioGroup>
  bad:
    - title: A single yes/no option modeled as a one-item group
      code: |
        <RadioGroup value={agreed ? 'yes' : 'no'} onValueChange={(v) => setAgreed(v === 'yes')}>
          <RadioGroupItem value="yes" /> I agree
        </RadioGroup>
      why: >-
        One option is not a choice - the group's arrow-key navigation and
        single-selection machinery have nothing to coordinate. Reach for
        `Checkbox` instead.

# Family membership. Every member names the same family and states its own
# role; `members` is filled by the compiler on the root from every contract
# naming this family as a part, so nothing here points at a sibling.
family_membership:
  name: radio_group
  role: root

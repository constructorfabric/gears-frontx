# Semantic overlay for RadioGroupItem - the other half of the RadioGroup
# family, see radio-group.contract.yaml's `family_membership` for how the
# two contracts relate.
component: radio-group-item

intent: One selectable option of a RadioGroup, identified by a value unique within that group.

typical_uses:
  - One entry in a RadioGroup's set of mutually exclusive options

dont_use_when:
  - situation: An independent yes/no control with no sibling options to choose between
    instead:
      target: Checkbox
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.checkbox.v1

# RadioGroupItemProps declares no children field and the component renders
# only its own fixed indicator/dot internally - a children value a consumer
# passes through the forwarded span surface is overridden by that fixed JSX
# child, never rendered. There is no slot for anything a consumer puts
# inside; the visible caption is a sibling Label whose htmlFor names the
# item's id (see examples).
accepts:
  content: nothing

invariants:
  - id: value-identifies-item-within-its-group
    text: >-
      `value` identifies this item within its nearest RadioGroup; the group
      selects by comparing this value against its own `value`/`defaultValue`
      by identity, not by which item renders first or how many precede it.
  - id: aria-invalid-tints-border-destructive
    text: >-
      Setting `aria-invalid="true"` on an item tints its border to the
      destructive color; a checked item's border stays the primary checked
      color even while invalid - the checked state wins over the invalid one.

anti_patterns:
  - dont: Render a RadioGroupItem outside any RadioGroup
    do_instead: >-
      Mount it inside a RadioGroup - the group holds the shared value,
      arrow-key navigation and the single-selection contract; an item
      outside one has no state to read or write
  - dont: Reuse the same `value` for two items under one RadioGroup
    do_instead: Give every item a unique `value` within its own group - the group selects by value identity (see value-identifies-item-within-its-group), so items sharing a value show as checked together and cannot be told apart

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      Base UI's own Radio primitive (role="radio", a hidden native input for
      form submission, aria-checked and data-checked/data-unchecked wiring)
      plus radio-group.test.tsx's own role/aria-checked/data-disabled
      assertions
  rtl:
    outcome: unknown

# What each property that reaches this contract asserting nothing (or only
# part of its shape) actually states, and why - keyed on the property
# itself. The compiler emits both halves into that property's own
# description, beside the `TS:` text.
prop_statements:
  value:
    states: value is the item's own generic Value type parameter, required and typed by the caller
    because: >-
      Base UI's Radio.Root declares `value: Value` with no `?` - required,
      and typed by the caller's own generic parameter, so no JSON Schema
      type can state what it holds, only that it must be present. It is
      compared by identity against the nearest RadioGroup's own
      `value`/`defaultValue`.
  inputRef:
    states: inputRef is a ref to the hidden native input Base UI renders for form submission
    because: >-
      `React.Ref<HTMLInputElement>` is a union of a ref object and a
      callback function - the compiler emits one JSON type per property. It exists
      so a consumer can read or focus this item's own hidden input
      directly.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the item's own
      state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the item's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (checked, disabled, readOnly, required,
      ...). The compiler emits one JSON type per property, so
      nothing is asserted; the kit's own styling goes through
      radio-group.module.css, not through this.

# Internal structure this component composes that the kit does not expose
# as a component of its own.
unexposed_parts:
  - part: Base UI's Radio.Indicator and the kit's own fixed inner dot
    reason: >-
      The kit's RadioGroupItem composes Base UI's Radio.Root around
      Radio.Indicator and a fixed decorative dot into one exported
      component; this contract describes the exported Root surface, not
      the internal indicator composition, so Indicator's own props are not
      part of it.

examples:
  good:
    - title: An item captioned by a sibling Label, inside a group
      code: |
        <RadioGroup value={tier} onValueChange={setTier} aria-label="Plan tier">
          <RadioGroupItem value="pro" id="tier-pro" />
          <Label htmlFor="tier-pro">Pro</Label>
        </RadioGroup>
    - title: A disabled item, named directly for assistive tech
      code: <RadioGroupItem value="enterprise" aria-label="Enterprise" disabled />
  bad:
    - title: An item with no RadioGroup around it
      code: <RadioGroupItem value="pro" aria-label="Pro" />
      why: >-
        RadioGroupItem has no selection state of its own - it reads and
        writes the nearest RadioGroup's value through Base UI context, so
        mounting it outside one renders a control that never checks itself.

family_membership:
  name: radio_group
  role: part

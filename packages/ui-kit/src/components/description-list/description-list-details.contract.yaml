# Semantic overlay for DescriptionListDetails - part of the DescriptionList family, see
# description-list.contract.yaml's `family_membership` for how the four
# contracts relate. `mounted_in` is filled from the accepting part's list.
component: description-list-details

intent: Give the value of one fact in a description list.

typical_uses:
  - The value of a fact, such as a team name or a path

dont_use_when:
  - situation: A value the user edits
    instead:
      target: Field
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field.v1

accepts:
  content: specified
  text: true

invariants:
  - id: body-value-wraps
    text: >-
      The value is a `dd` with no margin on the body role (meta in a small
      list) in --foreground; `typography="mono"` sets --font-mono, and a
      long unbroken token wraps inside its column.

anti_patterns: []

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: A path on the mono role
      code: <DescriptionListDetails typography="mono">src/app/main.tsx</DescriptionListDetails>

  bad:
    - title: A value outside its item
      code: |
        <DescriptionList>
          <DescriptionListDetails>Platform team</DescriptionListDetails>
        </DescriptionList>
      why: >-
        A value without its term and item reads as a name-less fact and
        breaks the horizontal grid; put it in a DescriptionListItem after its
        DescriptionListTerm.

family_membership:
  name: description_list
  role: part

# Semantic overlay for DescriptionList - the hand-written half of the
# contract. The orientation and size axes and the host element are read by
# the compiler from description-list.tsx. The family is DescriptionList,
# DescriptionListItem, DescriptionListTerm and DescriptionListDetails; each part has its
# own overlay, and `family_membership` below is how a reader walks between
# them.
component: description-list

intent: Show name and value pairs as a real description list, so assistive technology keeps each term with its value.

typical_uses:
  - The facts of a record in a detail panel
  - A short "before you start" aside of requirements and values

dont_use_when:
  - situation: A form row with an input
    instead:
      target: Field
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field.v1
  - situation: Rows the user acts on or navigates
    instead:
      target: Item
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.item.v1
  - situation: Data compared across many records
    instead:
      target: Table
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.table.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.description_list_item.v1 # DescriptionListItem

invariants:
  - id: real-elements
    text: The list renders `dl`, each item a `div`, each term a `dt` and each value a `dd`; no part takes `render`.
  - id: horizontal-terms-in-one-column
    text: >-
      Horizontal is a two-column grid sized to the widest term, with each
      item on a subgrid, so every term lines up in one column at any width.
  - id: tokens-only
    text: >-
      The term uses the label role on `--muted-foreground`, the value the
      body role (meta at `sm`); `typography="mono"` sets `--font-mono`.

anti_patterns:
  - dont: Build the pairs from divs and spans
    do_instead: Use DescriptionList; divs lose the term-to-value relation

deprecations: {}

# description-list.test.tsx asserts the dl > div > dt + dd structure and
# the axis classes; nothing in it runs an accessibility engine or renders
# under a right-to-left direction.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Two facts side by side
      code: |
        <DescriptionList orientation="horizontal">
          <DescriptionListItem>
            <DescriptionListTerm>Owner</DescriptionListTerm>
            <DescriptionListDetails>Platform team</DescriptionListDetails>
          </DescriptionListItem>
        </DescriptionList>
  bad:
    - title: A term without its item
      code: <DescriptionList><DescriptionListTerm>Owner</DescriptionListTerm></DescriptionList>
      why: Each pair sits in a DescriptionListItem, which the horizontal grid aligns.

family_membership:
  name: description_list
  role: root

# Semantic overlay for ResizableHandle - a part of the resizable family,
# see resizable-panel-group.contract.yaml's `family_membership`. It wraps
# the library's Separator and adds only the optional grip.
component: resizable-handle

intent: The draggable, keyboard-operable divider between two panels of a ResizablePanelGroup.

typical_uses:
  - The divider between two adjacent panels, optionally with a visible grip

dont_use_when:
  - situation: A static dividing line that nobody drags
    instead:
      target: Separator
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.separator.v1

# The kit passes its own children (the grip, or nothing) to the library's
# Separator after the consumer's props, so consumer children never render.
accepts:
  content: nothing

invariants:
  - id: aria-orientation-is-the-line
    text: >-
      The handle's `aria-orientation` describes the drawn line, which is
      the opposite of the group's `orientation`: `vertical` in a horizontal
      group and `horizontal` in a vertical one. resizable.module.css keys
      the handle's geometry and the grip's 90 degree rotation on it.
  - id: keyboard-resizing
    text: >-
      A focused handle resizes its neighbours with the arrow keys along the
      group's axis and with Home and End, Enter collapses or expands the
      panel before the handle when it is `collapsible`, and F6 moves focus
      to the group's next handle (Shift+F6 to the previous).
      Double-clicking resets the first adjoining panel that has a
      `defaultSize` to it, unless `disableDoubleClick` is set; with no
      `defaultSize` on either it does nothing.
  - id: disabled-leaves-tab-order
    text: >-
      A `disabled` handle cannot be used to resize its neighbouring panels,
      is removed from the tab order and carries `aria-disabled`; its panels
      can still change size when another handle moves them.

anti_patterns:
  - dont: Put an icon or text inside the handle as children
    do_instead: Set `withHandle` for the kit's grip; the handle renders no consumer children

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Separator (role="separator", aria-orientation,
      aria-valuenow, aria-valuemin, aria-valuemax, aria-controls, tabIndex 0
      unless disabled, and arrow, Home, End and Enter keyboard resizing),
      plus resizable.test.tsx asserting role separator and aria-orientation
      vertical in a horizontal group and horizontal in a vertical one
  rtl:
    outcome: unknown

unexposed_parts:
  - part: the grip
    reason: >-
      A div styled by resizable.module.css's `.grip`, holding a vertical
      grip icon, rendered only when `withHandle` is set; it is not a
      component of its own.

prop_statements:
  elementRef:
    states: elementRef is a ref to the handle's div element
    because: >-
      `Ref<HTMLDivElement>` is a union of a ref object and a callback
      function - the compiler emits one JSON type per property.
  style:
    states: style is a plain style object applied inline to the handle's div
    because: >-
      `CSSProperties` is React's style object type, which the compiler
      leaves to tsc. The library sets `flex-grow` and `flex-shrink` after
      it, so those two cannot be overridden; the kit's own styling goes
      through resizable.module.css.

examples:
  good:
    - title: A handle with a visible grip
      code: <ResizableHandle withHandle />
  bad:
    - title: A custom icon passed as children
      code: |
        <ResizableHandle>
          <GripHorizontalIcon />
        </ResizableHandle>
      why: The handle renders only the kit's grip; the icon never appears.

family_membership:
  name: resizable
  role: part

# Semantic overlay for SheetTitle - a part of the Sheet family, see
# sheet.contract.yaml's `family_membership` for how the contracts relate.
component: sheet-title

intent: The heading that names a sheet's panel.

typical_uses:
  - The panel's heading, inside its SheetHeader

dont_use_when:
  - situation: A heading for a section inside the panel's body
    instead:
      target: a plain heading element (h3 and below)
      note: Only one SheetTitle names the panel; a section heading is ordinary content.
  - situation: The heading of a centered dialog
    instead:
      target: DialogTitle
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog_title.v1

# `mounted_in` is filled from SheetHeader's accepted components.
accepts:
  content: specified
  text: true

invariants:
  - id: heading-level-two
    text: >-
      SheetTitle renders an h2 set in the heading-2 type ramp with no
      margin.

anti_patterns:
  - dont: Render a second SheetTitle in the same panel
    do_instead: >-
      Keep one SheetTitle per sheet and use plain headings for any
      subheadings; only one title can name the panel

deprecations: {}

# sheet.test.tsx asserts only the title's kit class.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      title's state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property; the primitive passes an
      empty state object.
  style:
    states: style accepts a function as well as a plain style object; the primitive passes that function an empty state object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)`, and the title's state
      carries no fields. The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes through
      sheet.module.css, not through this.

examples:
  good:
    - title: The panel's heading
      code: |
        <SheetHeader>
          <SheetTitle>Edit profile</SheetTitle>
        </SheetHeader>
  bad:
    - title: A plain heading in place of SheetTitle
      code: |
        <SheetHeader>
          <h2>Edit profile</h2>
        </SheetHeader>
      why: >-
        A plain heading carries no id the primitive knows about, so the
        panel gets no `aria-labelledby` and a screen reader announces an
        unnamed dialog.

family_membership:
  name: sheet
  role: part

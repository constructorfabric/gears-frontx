# Semantic overlay for SheetClose - a part of the Sheet family, see
# sheet.contract.yaml's `family_membership` for how the contracts relate.
component: sheet-close

intent: A button inside the panel that closes its Sheet, for a close action the caller composes.

typical_uses:
  - A Cancel or Done action in the sheet's footer

dont_use_when:
  - situation: The close (X) button in the panel's corner
    instead:
      target: SheetContent
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sheet_content.v1
      note: SheetContent renders that button itself, switched by its `showCloseButton` prop.
  - situation: A close action in a centered dialog
    instead:
      target: DialogClose
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog_close.v1

# SheetContent and SheetFooter accept any content, so no kit container
# names this part and it gains no filled mount point; it works anywhere
# inside the Sheet root, and is meaningful inside the panel.
accepts:
  content: specified
  text: true

invariants:
  - id: unstyled-native-button
    text: >-
      SheetClose renders a native button with no kit class of its own; its
      look comes from `className` or from the element passed through
      `render`.
  - id: closes-the-enclosing-sheet
    text: >-
      A press closes the Sheet whose root encloses it, reporting a close
      press as the reason to that root's `onOpenChange`, unless its own
      `onClick` calls `event.preventBaseUIHandler()`.

anti_patterns:
  - dont: Render a non-button element through `render` while `nativeButton` stays at its default
    do_instead: >-
      Pass `nativeButton={false}` together with a `render` element that is
      not a native button, so the primitive adds the button role and keyboard
      handling itself

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Dialog.Close renders a native button; sheet.test.tsx
      asserts getByRole('button', { name: 'Cancel' }) on it and that clicking
      it removes the dialog ("closes via a consumer-composed SheetClose")
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the close
      button's own state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the close button's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled). The compiler emits one JSON type per property, so nothing is asserted; the kit sets no style
      of its own on this button.

examples:
  good:
    - title: A Cancel action stacked with the primary action
      code: |
        <SheetFooter>
          <SheetClose render={<Button variant="outline" />}>Cancel</SheetClose>
          <Button onClick={save}>Save</Button>
        </SheetFooter>
  bad:
    - title: A kit Button nested inside the close button
      code: |
        <SheetFooter>
          <SheetClose>
            <Button variant="outline">Cancel</Button>
          </SheetClose>
        </SheetFooter>
      why: >-
        SheetClose already renders a native button, so this nests a button
        inside a button, which HTML does not allow; pass the Button through
        `render` instead.

family_membership:
  name: sheet
  role: part

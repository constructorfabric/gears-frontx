# Semantic overlay for PopoverDescription - a part of the Popover family,
# see popover.contract.yaml's `family_membership` for how the contracts
# relate.
component: popover-description

intent: The supporting sentence under a PopoverTitle that describes the popover's panel to assistive technology.

typical_uses:
  - A sentence stating what the popover's controls change

dont_use_when:
  - situation: The supporting text under a dialog's title
    instead:
      target: DialogDescription
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog_description.v1
  - situation: The supporting text under a card's title on the page
    instead:
      target: CardDescription
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.card_description.v1

# `mounted_in` is filled from PopoverHeader's accepted components; the
# description's own text arrives through children.
accepts:
  content: specified
  text: true

invariants:
  - id: muted-paragraph
    text: >-
      PopoverDescription renders a p in the muted foreground color;
      popover.module.css sets no margin on it, so the browser's own
      paragraph margins still apply.

anti_patterns:
  - dont: Put the popover's form fields or long content inside PopoverDescription
    do_instead: >-
      Keep it to a short sentence and place fields and long content in
      PopoverContent after the header

deprecations: {}

# popover.test.tsx asserts only the description's kit class; nothing asserts
# the popup's aria-describedby.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      description's state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property; the primitive passes an
      empty state object.
  style:
    states: style accepts a function as well as a plain style object; the primitive passes that function an empty state object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)`, and the description's state
      carries no fields. The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes through
      popover.module.css, not through this.

examples:
  good:
    - title: A description under the title
      code: |
        <PopoverHeader>
          <PopoverTitle>Dimensions</PopoverTitle>
          <PopoverDescription>Set the dimensions for the layer.</PopoverDescription>
        </PopoverHeader>
  bad:
    - title: A form inside the description
      code: |
        <PopoverDescription>
          <Input aria-label="Width" />
        </PopoverDescription>
      why: >-
        Everything inside the description becomes the popup's accessible
        description through `aria-describedby`, field included.

family_membership:
  name: popover
  role: part

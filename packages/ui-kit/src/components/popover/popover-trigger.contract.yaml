# Semantic overlay for PopoverTrigger - a part of the Popover family, see
# popover.contract.yaml's `family_membership` for how the contracts relate.
component: popover-trigger

intent: The button whose press opens its Popover, and optionally its hover.

typical_uses:
  - The control that opens a panel of settings or filters beside it

dont_use_when:
  - situation: A button that opens nothing
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1
  - situation: A button that opens a list of actions
    instead:
      target: DropdownMenuTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_trigger.v1
  - situation: A text hint shown on hover or focus
    instead:
      target: TooltipTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.tooltip_trigger.v1
  - situation: A link whose preview shows on hover
    instead:
      target: HoverCardTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.hover_card_trigger.v1

# `mounted_in` is filled from the Popover root's accepted components, not
# authored here. The trigger's own caption and any glyph arrive through
# children; with `render`, the rendered element brings its own.
accepts:
  content: specified
  text: true

invariants:
  - id: unstyled-native-button
    text: >-
      PopoverTrigger renders a native button with no kit class of its own;
      its look comes from `className` or from the element passed through
      `render`.
  - id: announces-the-popup-it-opens
    text: >-
      The trigger carries `aria-haspopup="dialog"` and an `aria-expanded`
      that is true while the popover is open and was opened by this trigger;
      while the popover is open, the trigger that opened it, or the only
      trigger when none is recorded as the opener, also carries
      `aria-controls` with the popup's id.
  - id: hover-opens-only-with-open-on-hover
    text: >-
      A press toggles the popover; hover opens it only with `openOnHover`,
      for mouse pointers, once the pointer has rested on the trigger for
      `delay` milliseconds (300 when not given), and a popover opened by
      hover closes `closeDelay` milliseconds (0 when not given) after the
      pointer leaves both the trigger and the popup.

anti_patterns:
  - dont: Render a non-button element through `render` while `nativeButton` stays at its default
    do_instead: >-
      Pass `nativeButton={false}` together with a `render` element that is
      not a native button, so the primitive adds the button role and keyboard
      handling itself

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Popover.Trigger renders a native button with
      aria-haspopup and aria-expanded; popover.test.tsx asserts
      getByRole('button', { name: 'Open' }) on it and that clicking it opens
      the popup ("opens on trigger click and renders content with kit
      classes")
  rtl:
    outcome: unknown

prop_statements:
  handle:
    states: handle is an opaque object from the primitive's Popover.createHandle(), tying this trigger to a Popover root it is not placed inside
    because: >-
      `PopoverHandle<Payload>` is a class instance holding the popover's
      store, not data; the kit re-exports no createHandle, so a caller
      imports it from the primitive.
  payload:
    states: payload is any value handed to the root's function children when this trigger opens the popover
    because: >-
      Typed by the caller's own `Payload` type parameter (`unknown` here), so
      no JSON Schema type can state what it holds.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the trigger's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the trigger's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, open). The compiler emits one JSON type per property, so nothing is asserted; the kit sets no
      style of its own on the trigger.

examples:
  good:
    - title: The kit's Button rendered as the trigger
      code: |
        <Popover>
          <PopoverTrigger render={<Button variant="outline" />}>Dimensions</PopoverTrigger>
          <PopoverContent>
            <PopoverTitle>Dimensions</PopoverTitle>
          </PopoverContent>
        </Popover>
    - title: An icon button that also opens on hover, with an action in its panel
      code: |
        <Popover>
          <PopoverTrigger openOnHover delay={150} aria-label="About quotas">
            <InfoIcon />
          </PopoverTrigger>
          <PopoverContent>
            <PopoverTitle>Quota</PopoverTitle>
            <Button variant="outline" onClick={requestMore}>Request more</Button>
          </PopoverContent>
        </Popover>
  bad:
    - title: A kit Button nested inside the trigger
      code: |
        <Popover>
          <PopoverTrigger>
            <Button variant="outline">Dimensions</Button>
          </PopoverTrigger>
          <PopoverContent>
            <PopoverTitle>Dimensions</PopoverTitle>
          </PopoverContent>
        </Popover>
      why: >-
        The trigger already renders a native button, so this nests a button
        inside a button, which HTML does not allow; pass the Button through
        `render` instead.

family_membership:
  name: popover
  role: part

# Semantic overlay for Input - the hand-written half of the contract.
#
# Machine-extractable facts (the prop list, the forwarded native attribute
# set) do NOT belong here: the compiler reads them from input.tsx and the
# Base UI Input primitive it wraps, and refuses an overlay that restates
# them - one fact, one owner. This file carries only what the code cannot
# express: intent, boundaries, invariants.
component: input

intent: Capture a single line of typed text in a styled native input.

typical_uses:
  - A single-line value in a form (name, email, number, filename)

dont_use_when:
  - situation: Multi-line text
    instead:
      target: Textarea
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.textarea.v1
  - situation: One option picked from a small fixed set
    instead:
      target: RadioGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.radio_group.v1
  - situation: One option picked from a long fixed set
    instead:
      target: Select
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.select.v1
  - situation: A field with text addons, several adornments on one side, or several controls in one frame
    instead:
      target: InputGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.input_group.v1

# Input renders a native input element, which takes no children: everything
# a consumer means to put "in" the field arrives as a prop - the value, the
# leading icon, the trailing slot.
accepts:
  content: nothing

invariants:
  - id: value-wins-over-default-value
    text: >-
      `value` and `defaultValue` are both accepted; `defaultValue` seeds the
      initial state and is ignored afterwards, and when `value` is given it
      wins and the component follows it on every render.
  - id: no-slots-no-wrapper
    text: >-
      With neither `icon` nor `end` present the rendered element is a bare
      native input with nothing around it; when a slot is given the input is
      wrapped in a presentational span, and the consumer `className` is
      merged onto the input itself either way.
  - id: disabled-inerts-the-end-slot
    text: >-
      `disabled` given to Input also sets `inert` on the `end` wrapper, so a
      control left there leaves the tab order and cannot be activated while
      the field is disabled. The dimming of both slots is stylesheet-driven
      and follows the native input's disabled state however it got there;
      the `inert` is wired only from the `disabled` prop given to Input
      directly, so a disable that reaches the native input by another path
      does not apply it.
  - id: semantics-stay-on-the-native-type
    text: >-
      Nothing renders automatically and no slot adds role or name: a search
      field is `type="search"` with a magnifier in `icon`, and its searchbox
      role comes from the native type, never from the slot.
  - id: aria-invalid-restyles-destructive
    text: >-
      `aria-invalid` is forwarded unchanged and input.module.css keys the
      destructive border and ring off it; there is no separate error prop
      and no invalid state of the component's own.

anti_patterns:
  - dont: Expect label, description or error wiring to happen by itself
    do_instead: Pair Input with Field and wire `id` and `aria-describedby` by hand - the kit ships no component that connects them automatically
  - dont: Put live content or an interactive control in `icon`
    do_instead: Keep `icon` decorative; a clear or reveal action and other live content go in `end`
  - dont: Read the value out of `onChange`'s event target
    do_instead: Use `onValueChange`, which hands over the next string directly

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      input.test.tsx asserts the icon slot carries aria-hidden="true", that a
      disabled input's end slot carries the inert attribute while an enabled
      one does not, that the end slot renders as the input's next sibling in
      the DOM, and that the rendered element is a native input
  rtl:
    outcome: unknown

# What each property that reaches this contract asserting nothing actually
# states, and why - keyed on the property itself. The compiler emits both
# halves into that property's own description, beside the `TS:` text.
prop_statements:
  icon:
    states: icon is a React node, not a value
    because: >-
      `ReactNode` is a union, and the compiler emits one JSON type per property - an element, a string,
      a fragment and `false` are all valid and only tsc can tell them from a
      mistake. The slot exists so the leading icon gets sized, positioned
      and marked aria-hidden; what may go in it is "anything React renders",
      which is the whole assertion.
  end:
    states: end is a React node, not a value
    because: >-
      `ReactNode` is a union, and the compiler emits one JSON type per property - an element, a string,
      a fragment and `false` are all valid and only tsc can tell them from a
      mistake. The slot is live trailing content that is never aria-hidden,
      so its name and keyboard behavior are the consumer's; what may go in
      it is "anything React renders", which is the whole assertion.
  value:
    states: value is the controlled field value, a string, a number or a readonly array of strings
    because: >-
      React types a native input's value as this three-way union; the schema
      asserts nothing for it, so the TypeScript type is the statement and
      tsc is the checker.
  defaultValue:
    states: defaultValue is the uncontrolled field's initial value, a string, a number or a readonly array of strings
    because: >-
      React types a native input's value as this three-way union; the schema
      asserts nothing for it, so the TypeScript type is the statement and
      tsc is the checker.
  onValueChange:
    states: onValueChange is a function called with the next value and event details, not a value
    because: >-
      A function type has no JSON Schema representation. Its second argument
      carries Base UI's own change-event-details shape (a reason, the
      triggering native event, and controls to cancel the change or allow it
      to propagate), which only tsc can check.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the input's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the input's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, focused, filled, valid, ...). The compiler emits one JSON type per property, so nothing is asserted; the kit's own
      styling goes through input.module.css, not through this.

# The props that take React nodes.
slots:
  - prop: icon
    description: >-
      Decorative leading icon inside the field: rendered aria-hidden with
      pointer events off, so it never carries the field's name and never
      takes a click.
  - prop: end
    description: >-
      Live trailing slot rendered after the input in the DOM, sized for a
      compact icon-only control; wider content is the consumer's own padding
      to extend.

# Internal structure this component composes that the kit does not expose as
# a component of its own.
unexposed_parts:
  - part: the presentational wrapper span
    reason: >-
      Exists only when a slot is given, because a native input is a replaced
      element with no way to host positioned children; it carries no
      behavior of its own.
  - part: the icon slot span
    reason: >-
      Decorative by construction - aria-hidden with pointer events off - so
      there is nothing for a consumer to reach or replace.
  - part: the end slot span
    reason: >-
      A positioning wrapper only; content passed there keeps its own
      behavior and refs, so the span is never what a consumer wants.

examples:
  good:
    - title: Uncontrolled with a placeholder
      code: <Input placeholder="Project name" />
    - title: Search field with a decorative icon and a clear action
      code: |
        <Input
          type="search"
          placeholder="Search projects"
          icon={<MagnifierIcon />}
          end={<Button size="sm" icon={<CrossIcon />} aria-label="Clear" />}
        />
    - title: Controlled value
      code: <Input type="email" value={email} onValueChange={setEmail} />
  bad:
    - title: Content passed as children
      code: <Input>typed text</Input>
      why: >-
        Input renders a native input element and takes no content: nothing
        inside the tag reaches the DOM. The label and helper text belong
        beside the field, and the value is a prop, not markup.
    - title: Interactive control in the decorative icon slot
      code: <Input placeholder="Find" icon={<button aria-label="Clear" />} />
      why: >-
        The icon slot is aria-hidden with pointer events off, so the control
        is invisible to assistive tech and dead to a click. Live content
        goes in `end`, which keeps its tab stop and its own name.
    - title: Reading the value from the native change event
      code: <Input onChange={(event) => setValue(event.target.value)} />
      why: >-
        `onValueChange` hands over the next string directly; the native
        event detour is extra code for the same value.

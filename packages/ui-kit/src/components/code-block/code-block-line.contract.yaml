# Semantic overlay for CodeBlockLine - part of the CodeBlock family, see
# code-block.contract.yaml's `family_membership` for how the eight
# contracts relate. `mounted_in` is filled from CodeBlockContent's accepted
# components.
component: code-block-line

intent: Hold one line of code, plain or marked as added, removed or highlighted.

typical_uses:
  - The lines of a diff
  - A line called out in an excerpt

dont_use_when:
  - situation: Plain code with no marked or numbered line
    instead:
      target: CodeBlockContent, with the code as a string
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.code_block_content.v1

accepts:
  content: specified
  text: true

invariants:
  - id: marks-and-fills
    text: >-
      `added` fills the line with --muted and marks it +, `removed` fills
      it with --destructive at 10% and marks it − in --destructive,
      `highlighted` fills it with --muted; the marker sits in the line's
      start inset and is not selectable. An empty line holds a newline.

anti_patterns: []

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: A changed line in a diff
      code: |
        <CodeBlockContent lineNumbers>
          <CodeBlockLine variant="removed">return a</CodeBlockLine>
          <CodeBlockLine variant="added">return b</CodeBlockLine>
        </CodeBlockContent>
  bad:
    - title: A line outside its content
      code: <CodeBlock><CodeBlockLine>return a</CodeBlockLine></CodeBlock>
      why: >-
        The line's insets, numbering and mono face come from
        CodeBlockContent; put the lines inside it.

family_membership:
  name: code_block
  role: part

# Semantic overlay for FieldTitle - part of the Field family, see
# field.contract.yaml's `family_membership`. Its mount point (FieldContent)
# is filled from FieldContent's accepted components, not authored here.
component: field-title

intent: Show a label-weight title inside a FieldContent that is not a label element.

typical_uses:
  - The title above a description in a FieldContent, when the control is named another way

dont_use_when:
  - situation: A caption that should name the control and act as its click target
    instead:
      target: FieldLabel
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field_label.v1
  - situation: The title of a FieldSet
    instead:
      target: FieldLegend
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field_legend.v1

accepts:
  content: specified
  text: true

invariants:
  - id: names-nothing
    text: >-
      FieldTitle renders a plain div with the label type style and no role:
      it associates with no control, so the control needs its own
      accessible name. Inside a Field carrying data-disabled="true" it is
      dimmed to the disabled opacity.

anti_patterns:
  - dont: Let a FieldTitle be the only name a control has
    do_instead: Use FieldLabel with htmlFor, or give the control its own aria-label or aria-labelledby pointing at the title's id

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: A title that also names the switch through aria-labelledby
      code: |
        <Field orientation="horizontal">
          <FieldContent>
            <FieldTitle id="updates-title">Product updates</FieldTitle>
            <FieldDescription>Release notes and roadmap changes.</FieldDescription>
          </FieldContent>
          <Switch aria-labelledby="updates-title" />
        </Field>
  bad:
    - title: A title pointed at by htmlFor
      code: <FieldTitle htmlFor="updates">Product updates</FieldTitle>
      why: >-
        FieldTitle is a div, not a label; htmlFor does nothing on it. Use
        FieldLabel when the caption should name the control.

family_membership:
  name: field
  role: part

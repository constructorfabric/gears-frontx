# Semantic overlay for ComboboxSeparator - a part of the Combobox family, see
# combobox.contract.yaml's `family_membership`. It wraps Base UI's
# Combobox.Separator; the forwarded surface is its div.
component: combobox-separator

intent: A horizontal rule between sections of a Combobox's list.

typical_uses:
  - A divider between two groups of items

dont_use_when:
  - situation: A rule between sections of a page or a card, outside any combobox
    instead:
      target: Separator
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.separator.v1

accepts:
  content: nothing

invariants:
  - id: spans-the-list-padding
    text: >-
      combobox.module.css pulls the rule out by the list's padding on both
      sides, so it runs edge to edge across the popup, and gives it vertical
      margin of its own.
  - id: horizontal-only
    text: >-
      combobox.module.css draws only a horizontal rule; `orientation`
      changes the announced `aria-orientation`, not the drawing.
  - id: not-an-option
    text: >-
      The separator renders with role `separator`, takes no pointer events
      and is not an option that arrow keys land on.

anti_patterns:
  - dont: Put a separator first or last in the popup, or two in a row
    do_instead: Place separators only between items or groups; a rule at an edge or doubled draws a break with nothing on one side

deprecations: {}

# combobox.test.tsx asserts the separator's kit class; nothing asserts its
# role.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      separator's own state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the separator's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (orientation). The compiler emits one JSON type per property, so nothing is asserted; the kit's own
      styling goes through combobox.module.css, not through this.

examples:
  good:
    - title: A divider between two groups
      code: |
        <ComboboxList>
          <ComboboxGroup>
            <ComboboxLabel>Europe</ComboboxLabel>
            <ComboboxItem value="frankfurt">Frankfurt</ComboboxItem>
          </ComboboxGroup>
          <ComboboxSeparator />
          <ComboboxGroup>
            <ComboboxLabel>Americas</ComboboxLabel>
            <ComboboxItem value="virginia">Virginia</ComboboxItem>
          </ComboboxGroup>
        </ComboboxList>
  bad:
    - title: The kit's standalone Separator inside the list
      code: |
        <ComboboxList>
          <ComboboxItem value="frankfurt">Frankfurt</ComboboxItem>
          <Separator />
          <ComboboxItem value="virginia">Virginia</ComboboxItem>
        </ComboboxList>
      why: >-
        The list accepts ComboboxSeparator, whose margins are set against the
        list's padding; a general Separator stops short of the popup's edges.

family_membership:
  name: combobox
  role: part

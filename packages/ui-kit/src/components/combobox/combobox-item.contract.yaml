# Semantic overlay for ComboboxItem - a part of the Combobox family, see
# combobox.contract.yaml's `family_membership`. It wraps Base UI's
# Combobox.Item and composes its ItemIndicator; the forwarded surface is the
# item's div.
component: combobox-item

intent: One choosable option in a Combobox's list, identified by its `value` and marked with a check while chosen.

typical_uses:
  - One entry of a combobox's list, rendered for one item of the root's `items`

dont_use_when:
  - situation: An entry that runs a command rather than setting a value
    instead:
      target: CommandItem
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.command_item.v1

# The option's caption arrives as children; the check mark trails it.
accepts:
  content: specified
  text: true

invariants:
  - id: value-identifies-the-item
    text: >-
      `value` is what choosing the item puts into the root's value; the
      root compares it with the chosen value by `Object.is` unless the
      root's `isItemEqualToValue` says otherwise.
  - id: check-mark-while-chosen
    text: >-
      While the item is chosen a check mark renders at its inline end;
      while it is not chosen the mark is not in the DOM.
  - id: disabled-item-reached-but-not-chosen
    text: >-
      A disabled item is still reached by arrow keys but cannot be chosen by
      pointer or keyboard, and combobox.module.css dims it and ignores
      pointer events on it.

anti_patterns:
  - dont: Render the item as a `<button>` or another focusable element through `render`
    do_instead: >-
      Keep the default div; focus stays on the field while the highlight
      moves through the items, and a focusable item takes it away

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Combobox.Item sets role="option" and aria-selected;
      combobox.test.tsx asserts the options are found by role option and
      that pressing the option named "Europe" reports "Europe" through
      onValueChange
  rtl:
    outcome: unknown

unexposed_parts:
  - part: Combobox.ItemIndicator
    reason: Composed inside ComboboxItem as the trailing check mark, styled by combobox.module.css.

prop_statements:
  children:
    states: children is the option's caption, any React content
    because: >-
      `ReactNode` is a union of elements, strings, numbers, fragments and
      more, which the compiler cannot state as one JSON type.
  value:
    states: value is the item this option stands for, of the caller's own item type
    because: >-
      Typed `any` by the primitive, so the schema asserts nothing; it is one
      entry of the root's `items`.
  onClick:
    states: onClick is a callback called when the item is pressed with the pointer, or with Enter while highlighted
    because: >-
      A function of Base UI's wrapped mouse event, which no JSON Schema type
      covers.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the item's
      own state, so its type is a union of a React element and a callback -
      neither expressible in JSON Schema.
  style:
    states: style accepts a function of the item's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, selected, highlighted). A JSON
      Schema `object` would reject the function form, so nothing is
      asserted; the kit's own styling goes through combobox.module.css, not
      through this.

examples:
  good:
    - title: An item rendered for one entry of the root's items
      code: |
        <ComboboxList>
          {(item) => (
            <ComboboxItem key={item} value={item}>
              {item}
            </ComboboxItem>
          )}
        </ComboboxList>
    - title: A disabled item
      code: <ComboboxItem value="antarctica" disabled>Antarctica</ComboboxItem>
  bad:
    - title: An item with no value
      code: <ComboboxItem>Europe</ComboboxItem>
      why: >-
        Without `value` the item stands for null, so in a one-value combobox
        choosing it sets the root's value to null, the same as clearing it;
        give every item the entry of `items` it renders.

family_membership:
  name: combobox
  role: part

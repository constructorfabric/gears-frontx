# Semantic overlay for AlertDialogMedia - a part of the AlertDialog family,
# see alert-dialog.contract.yaml's `family_membership` for how the ten
# contracts relate. `mounted_in` is filled from AlertDialogHeader's accepted
# components, not authored here.
component: alert-dialog-media

intent: Hold an alert dialog's leading icon or small illustration on a filled square plate above its title.

typical_uses:
  - A warning glyph above the question of a destructive confirmation

dont_use_when:
  - situation: A person's or entity's picture with a fallback
    instead:
      target: Avatar
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.avatar.v1

# An icon or an image: any element, so the content is not constrained to
# kit components.
accepts:
  content: unconstrained

invariants:
  - id: fixed-4rem-plate
    text: >-
      AlertDialogMedia is a fixed 4rem square with rounded corners, filled
      with var(--muted), that centers its content; it does not size the
      content itself.

anti_patterns: []

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: A warning glyph at the head of a confirmation
      code: |
        <AlertDialogHeader>
          <AlertDialogMedia>
            <WarningIcon />
          </AlertDialogMedia>
          <AlertDialogTitle>Delete this project?</AlertDialogTitle>
        </AlertDialogHeader>
  bad:
    - title: The media placed straight in the popup
      code: |
        <AlertDialogContent>
          <AlertDialogMedia>
            <WarningIcon />
          </AlertDialogMedia>
          <AlertDialogTitle>Delete this project?</AlertDialogTitle>
        </AlertDialogContent>
      why: >-
        As a direct child of the popup the plate takes the popup's region
        inset, a var(--space-6) padding on each side inside its fixed 4rem
        width, which leaves 1rem for the glyph; inside AlertDialogHeader it
        keeps its full plate and is centered with the title.

family_membership:
  name: alert_dialog
  role: part

# Semantic overlay for AlertDialog (the root) - the hand-written half of one
# of ten contracts describing this compound component. The parts are
# alert-dialog-trigger, alert-dialog-content, alert-dialog-header,
# alert-dialog-footer, alert-dialog-media, alert-dialog-title,
# alert-dialog-description, alert-dialog-action and alert-dialog-cancel;
# `family_membership` below is how a reader walks between them.
#
# Machine-extractable facts (prop list, forwarded surface) do NOT belong
# here: the compiler takes those from alert-dialog.tsx and the Base UI
# AlertDialog.Root primitive it re-exports. The root renders no element of
# its own, so it names no element surface.
component: alert-dialog

intent: Hold the open state of one modal confirmation that interrupts the user until they explicitly confirm or cancel.

typical_uses:
  - Confirming a destructive or irreversible action, such as deleting a record or discarding unsaved changes

dont_use_when:
  - situation: A modal the user may dismiss by pressing outside it, or one holding a form or other free content
    instead:
      target: Dialog
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog.v1
  - situation: A panel that slides in from an edge of the screen
    instead:
      target: Sheet
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sheet.v1
  - situation: A status message that sits in the page without blocking it
    instead:
      target: Alert
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.alert.v1
  - situation: A transient notification that needs no answer
    instead:
      target: Toaster
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.toast_toaster.v1

# The ONE authored statement of the root's nesting: the compiler fills the
# trigger's and the content's `mounted_in` from this list.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.alert_dialog_trigger.v1 # AlertDialogTrigger
    - gts.frontx.uikit._.component.v1~frontx.uikit._.alert_dialog_content.v1 # AlertDialogContent

invariants:
  - id: open-wins-over-default-open
    text: >-
      `open` and `defaultOpen` are both accepted; `defaultOpen` seeds the
      initial state and is ignored afterwards, and when `open` is given it
      wins and the component follows it on every render.
  - id: always-modal-never-closed-by-outside-press
    text: >-
      The alert dialog is always modal: while open it traps focus inside the
      popup and locks page scroll, and a press outside the popup, on the
      backdrop or elsewhere, never closes it. The root takes no `modal` and
      no `disablePointerDismissal` prop to change either.
  - id: closed-by-escape-or-a-close-part
    text: >-
      While open, the alert dialog closes on Escape, on AlertDialogAction or
      AlertDialogCancel, or when the caller sets `open` to false; each close
      the component makes is reported through `onOpenChange`. With nested
      dialogs open, Escape closes only the topmost one.

anti_patterns: []

deprecations: {}

# alert-dialog.test.tsx asserts that the popup is found by role
# `alertdialog` and that an outside press leaves it open; that is the
# primitive's popup, recorded on alert-dialog-content. The root renders no
# element to attest.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  children:
    states: children is the root's content, either React nodes or a function of the active trigger's payload that returns them
    because: >-
      `React.ReactNode | PayloadChildRenderFunction<Payload>` - the function
      form receives `{ payload }` from whichever trigger opened the dialog.
      The compiler emits one JSON type per property, and a function has no JSON Schema representation.
  onOpenChange:
    states: onOpenChange is a callback called with the next open state and event details, not a value
    because: >-
      `(open: boolean, eventDetails) => void`; the second argument carries
      Base UI's change-event details, including the reason (such as a
      trigger press, Escape or a close press). No JSON Schema type covers a
      function.
  onOpenChangeComplete:
    states: onOpenChangeComplete is a callback called with the open state once the open or close animation has finished
    because: >-
      `(open: boolean) => void` - a function, which no JSON Schema type
      covers.
  actionsRef:
    states: actionsRef is a ref the root fills with imperative `close` and `unmount` actions
    because: >-
      `React.RefObject<AlertDialogRootActions | null>` - a ref object holding
      functions, which no JSON Schema type covers.
  handle:
    states: handle is an opaque object from the primitive's AlertDialog.createHandle(), shared with a trigger placed outside this root
    because: >-
      `AlertDialogHandle<Payload>` is a class instance holding the dialog's
      store, not data; the kit re-exports no createHandle, so a caller
      imports it from the primitive.
  triggerId:
    states: triggerId is the id of the trigger a controlled dialog is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.
  defaultTriggerId:
    states: defaultTriggerId is the id of the trigger an initially open dialog is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.

examples:
  good:
    - title: A destructive confirmation opened from its trigger
      code: |
        <AlertDialog>
          <AlertDialogTrigger render={<Button variant="destructive" />}>Delete account</AlertDialogTrigger>
          <AlertDialogContent>
            <AlertDialogHeader>
              <AlertDialogTitle>Delete this account?</AlertDialogTitle>
              <AlertDialogDescription>This cannot be undone.</AlertDialogDescription>
            </AlertDialogHeader>
            <AlertDialogFooter>
              <AlertDialogCancel>Cancel</AlertDialogCancel>
              <AlertDialogAction variant="destructive" onClick={deleteAccount}>Delete</AlertDialogAction>
            </AlertDialogFooter>
          </AlertDialogContent>
        </AlertDialog>
    - title: A confirmation opened from state the caller owns
      code: |
        <AlertDialog open={open} onOpenChange={setOpen}>
          <AlertDialogContent>
            <AlertDialogTitle>Discard unsaved changes?</AlertDialogTitle>
            <AlertDialogFooter>
              <AlertDialogCancel>Keep editing</AlertDialogCancel>
              <AlertDialogAction onClick={discard}>Discard</AlertDialogAction>
            </AlertDialogFooter>
          </AlertDialogContent>
        </AlertDialog>
  bad:
    - title: A made-up modal prop to let an outside press close it
      code: |
        <AlertDialog modal={false}>
          <AlertDialogTrigger>Delete</AlertDialogTrigger>
          <AlertDialogContent>
            <AlertDialogTitle>Delete this file?</AlertDialogTitle>
          </AlertDialogContent>
        </AlertDialog>
      why: >-
        The alert dialog's root takes no `modal` prop; it is always modal and
        never closes on an outside press. A dismissible modal is Dialog.

family_membership:
  name: alert_dialog
  role: root

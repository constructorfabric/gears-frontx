# Semantic overlay for ButtonGroupText - a part of the ButtonGroup family,
# see button-group.contract.yaml's `family_membership`.
component: button-group-text

intent: A static text segment inside a ButtonGroup, drawn as a filled plate with the same hairline as the controls beside it.

typical_uses:
  - A caption or unit joined to the controls around it (a prefix, a currency sign)

dont_use_when:
  - situation: A caption that names a form control, outside any ButtonGroup
    instead:
      target: Label
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.label.v1
  - situation: Text or a unit attached inside one text field
    instead:
      target: InputGroupText
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.input_group_text.v1

# Text, optionally with an inline icon: any descendant svg is sized to the
# small icon size.
accepts:
  content: specified
  text: true

invariants:
  - id: svg-descendants-sized-small
    text: >-
      Any svg inside the segment, at any depth, is sized to the small icon
      size, does not shrink, and ignores pointer events.

anti_patterns:
  - dont: Put an interactive control inside ButtonGroupText
    do_instead: >-
      Place the control as its own direct child of the ButtonGroup; the text
      segment is a static plate, not a container for controls

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      useRender's render prop takes an element or a function of the text
      segment's own state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property.

examples:
  good:
    - title: A caption joined to the actions it introduces
      code: |
        <ButtonGroup aria-label="Sort order">
          <ButtonGroupText>Sort</ButtonGroupText>
          <Button variant="outline">Newest first</Button>
          <Button variant="outline">Oldest first</Button>
        </ButtonGroup>
  bad:
    - title: A button placed inside the text segment
      code: |
        <ButtonGroup>
          <ButtonGroupText>Sort <Button>Newest</Button></ButtonGroupText>
        </ButtonGroup>
      why: >-
        The Button is not a direct child of the group, so it is not joined,
        and it sits inside a muted plate meant for static text.

family_membership:
  name: button_group
  role: part

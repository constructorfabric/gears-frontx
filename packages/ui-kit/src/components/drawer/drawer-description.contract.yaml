# Semantic overlay for DrawerDescription - a part of the Drawer family, see
# drawer.contract.yaml's `family_membership` for how the contracts relate.
component: drawer-description

intent: The short text that describes a drawer's panel, under its title.

typical_uses:
  - One sentence telling the user what the panel is for

dont_use_when:
  - situation: Body text inside the panel that does not summarize it
    instead:
      target: a plain paragraph element
      note: Only the description is announced with the panel; other text is ordinary content.
  - situation: The description of an edge panel with no swipe gesture
    instead:
      target: SheetDescription
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sheet_description.v1
  - situation: The description of a centered dialog
    instead:
      target: DialogDescription
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog_description.v1

# `mounted_in` is filled from DrawerHeader's accepted components.
accepts:
  content: specified
  text: true

invariants:
  - id: muted-paragraph
    text: >-
      DrawerDescription renders a p in the body type ramp with the muted
      foreground color and balanced line wrapping.

anti_patterns:
  - dont: Put paragraphs of instructions in DrawerDescription
    do_instead: >-
      Keep it to a sentence and put longer text in the panel's body, since
      the whole description is announced when the panel opens

deprecations: {}

# drawer.test.tsx asserts only the description's kit class.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      description's state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property; the primitive passes an
      empty state object.
  style:
    states: style accepts a function as well as a plain style object; the primitive passes that function an empty state object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)`, and the description's state
      carries no fields. The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes through
      drawer.module.css, not through this.

examples:
  good:
    - title: A description under the title
      code: |
        <DrawerHeader>
          <DrawerTitle>Share</DrawerTitle>
          <DrawerDescription>Anyone with the link can view this file.</DrawerDescription>
        </DrawerHeader>
  bad:
    - title: A description outside the panel
      code: |
        <Drawer>
          <DrawerDescription>Anyone with the link can view this file.</DrawerDescription>
          <DrawerContent>
            <DrawerTitle>Share</DrawerTitle>
          </DrawerContent>
        </Drawer>
      why: >-
        Placed beside DrawerContent it renders in the page, not in the panel,
        so the page shows the text even while the drawer is closed.

family_membership:
  name: drawer
  role: part

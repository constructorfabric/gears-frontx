# Semantic overlay for DrawerContent - a part of the Drawer family, see
# drawer.contract.yaml's `family_membership` for how the contracts relate.
# It composes the kit's DrawerPortal and DrawerBackdrop with the
# primitive's Viewport, Popup and Content; the forwarded surface is the
# Popup's div.
component: drawer-content

intent: The panel itself, portalled over the page, pinned to the edge its Drawer names and dismissible by a swipe toward that edge.

typical_uses:
  - A form, a filter set or a record's details in a panel rising from the bottom edge
  - A full-height panel at the left or right edge that the user swipes away

dont_use_when:
  - situation: An edge panel with no swipe gesture
    instead:
      target: SheetContent
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sheet_content.v1
  - situation: A popup centered over the page
    instead:
      target: DialogContent
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dialog_content.v1
  - situation: A floating panel anchored beside its trigger rather than to the viewport edge
    instead:
      target: PopoverContent
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.popover_content.v1

# The panel takes whatever a caller puts in it - its header, footer, title
# and close parts as well as forms, lists and any other content - so its
# children are not constrained to a list.
accepts:
  content: unconstrained

invariants:
  - id: rendered-only-while-open
    text: >-
      The panel and its backdrop are in the DOM only while the drawer is
      open or animating closed; the kit passes no `keepMounted` to the
      portal, so a closed drawer renders nothing.
  - id: portals-to-body-unless-container
    text: >-
      Without `container`, the panel portals into the node of the nearest
      enclosing portal, or the document body when there is none; a theme
      scoped to a subtree reaches the panel only when that subtree, or a
      node inside it, is passed as `container`.
  - id: reads-side-from-the-root
    text: >-
      The panel takes its edge and its swipe handle from the enclosing
      Drawer's `side` and `showSwipeHandle`, stamping the edge as
      `data-side`; rendered outside a Drawer it throws.
  - id: named-by-its-title-described-by-its-description
    text: >-
      The panel takes its accessible name from the DrawerTitle inside it and
      its description from the DrawerDescription, through `aria-labelledby`
      and `aria-describedby`; without a title, pass `aria-label` on
      DrawerContent.
  - id: focus-moves-to-the-panel-on-open
    text: >-
      Unless `initialFocus` says otherwise, opening moves focus to the panel
      itself rather than to the first control inside it.
  - id: backdrop-only-while-modal-and-not-nested
    text: >-
      The panel draws its DrawerBackdrop only while the root's `modal` is
      exactly `true`, and no prop switches it off separately; where that
      backdrop is not drawn for a nested drawer (see DrawerBackdrop), the
      primitive's transparent backdrop still blocks the page under it.
  - id: side-pins-and-sizes-the-panel
    text: >-
      `top` and `bottom` panels span the full width with a height sized to
      the content, or to the full cap when the root has `snapPoints`, capped
      at the viewport height minus 6rem; `left` and `right` panels span the
      full height at 75% of the width, capped at 24rem from a 640px viewport
      up. Only the edge that faces the page gets a border, and no corner is
      rounded.
  - id: padded-region-clips-its-overflow
    text: >-
      Children render in an inner content region, not in the forwarded
      panel element, so `className` styles the panel and not that region;
      the region has a var(--space-6) padding, spaces its children
      var(--space-6) apart in a column and hides overflow on both axes, so
      content taller than the panel is cut off rather than scrolled.
  - id: reduced-motion-drops-the-slide
    text: >-
      The panel slides in from its edge and back out, following the pointer
      during a swipe; under `prefers-reduced-motion` drawer.module.css drops
      the transform, height and filter transitions, so the panel appears and
      disappears without motion while the backdrop keeps its fade.

anti_patterns:
  - dont: Build a modal drawer with no DrawerClose inside the panel
    do_instead: >-
      Place a DrawerClose in the panel, such as in DrawerFooter; the panel
      has no built-in close button, and a modal drawer needs a close control
      inside it so touch screen reader users can leave it
  - dont: Leave out DrawerTitle for a cleaner look
    do_instead: >-
      Render a DrawerTitle and hide it visually through its `className` when
      the design shows no heading, so the panel keeps an accessible name
  - dont: Put a body taller than the panel straight into DrawerContent
    do_instead: >-
      Wrap the long body in a scroll container of its own, such as a
      ScrollArea, since the panel's content region clips instead of
      scrolling

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Drawer.Popup renders the role from Base UI's dialog
      store, `dialog`; drawer.test.tsx asserts getByRole('dialog') once the
      trigger is clicked and that Escape on it removes it ("closes on
      Escape")
  rtl:
    outcome: unknown

unexposed_parts:
  - part: Drawer.Viewport
    reason: Composed inside DrawerContent as the full-viewport layer that tracks the swipe; it blocks pointer events only while the root's `modal` is `true`.
  - part: Drawer.Content
    reason: Composed inside DrawerContent as the padded content region that holds the children, styled by drawer.module.css.

prop_statements:
  container:
    states: container is the DOM node, shadow root or ref to one that the panel portals into; an explicit null renders no panel until a node is passed
    because: >-
      `HTMLElement | ShadowRoot | RefObject<HTMLElement | ShadowRoot | null> | null`
      - live DOM nodes and ref objects, which no JSON Schema type covers.
  initialFocus:
    states: initialFocus picks the element focused on open - left out, the panel itself; true for the first tabbable element, or the panel when it holds none; false for no move; a ref to an element; or a function of the opening interaction type
    because: >-
      `boolean | RefObject<HTMLElement | null> | ((openType) => boolean | HTMLElement | null | void)`
      - a ref object and a function, which no JSON Schema type covers.
  finalFocus:
    states: finalFocus picks the element focused on close - true for the trigger or the previously focused element, false for no move, a ref to an element, or a function of the closing interaction type
    because: >-
      `boolean | RefObject<HTMLElement | null> | ((closeType) => boolean | HTMLElement | null | void)`
      - a ref object and a function, which no JSON Schema type covers.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the panel's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the panel's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (open, transitionStatus, expanded, nested,
      nestedDrawerOpen, nestedDrawerSwiping, swipeDirection, swiping). The compiler emits one JSON type per property, so nothing is
      asserted; the kit's own styling goes through drawer.module.css, not
      through this.

examples:
  good:
    - title: A bottom panel with a title, a body and footer actions
      code: |
        <Drawer>
          <DrawerTrigger render={<Button variant="outline" />}>Filters</DrawerTrigger>
          <DrawerContent>
            <DrawerHeader>
              <DrawerTitle>Filters</DrawerTitle>
            </DrawerHeader>
            <FilterForm />
            <DrawerFooter>
              <DrawerClose render={<Button />}>Apply</DrawerClose>
            </DrawerFooter>
          </DrawerContent>
        </Drawer>
    - title: A panel portalled into a themed subtree
      code: |
        <Drawer>
          <DrawerTrigger>Details</DrawerTrigger>
          <DrawerContent container={themedSectionRef}>
            <DrawerTitle>Details</DrawerTitle>
            <DrawerClose>Done</DrawerClose>
          </DrawerContent>
        </Drawer>
  bad:
    - title: The edge set on the panel, as for a sheet
      code: |
        <Drawer>
          <DrawerTrigger>Filters</DrawerTrigger>
          <DrawerContent side="left">
            <DrawerTitle>Filters</DrawerTitle>
          </DrawerContent>
        </Drawer>
      why: >-
        DrawerContent takes no `side`; the edge is the root's prop, so this
        panel still opens from the bottom.

family_membership:
  name: drawer
  role: part

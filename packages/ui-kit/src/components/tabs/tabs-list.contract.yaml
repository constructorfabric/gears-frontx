# Semantic overlay for TabsList - a part of the Tabs family, see
# tabs.contract.yaml's `family_membership` for how the four contracts
# relate.
component: tabs-list

intent: Group a Tabs root's triggers into one row (or column) and draw the indicator that marks which one is active.

typical_uses:
  - The single row (or column) of triggers that sits above, or beside, a Tabs root's panels

dont_use_when:
  - situation: A segmented, bordered row of mutually exclusive options with no panel to show per choice
    instead:
      target: ToggleGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.toggle_group.v1
      note: >-
        TabsList draws only its own filled-track or trackless-line looks; the
        bordered segmented-control look belongs to ToggleGroup, not to a
        Tabs variant.

# `mounted_in` is filled from Tabs' own accepted components, not authored
# here.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.tabs_trigger.v1 # TabsTrigger

invariants:
  - id: variant-and-size-inherited-by-every-trigger
    text: >-
      TabsList's `variant` and `size` govern every TabsTrigger inside it; a
      trigger takes no prop of its own for either axis, so a list cannot
      hold two triggers that disagree.

anti_patterns:
  - dont: Style a TabsList to look like a bordered segmented control
    do_instead: Reach for ToggleGroup - the segmented look is its variant, not a Tabs one

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      Base UI's Tabs.List - tablist role and roving-tabindex arrow-key
      navigation between triggers - exercised by tabs.test.tsx's "keeps a
      disabled tab reachable by arrow-key navigation without activating it"
      assertion
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the list's own
      state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the list's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (orientation, tabActivationDirection). The compiler emits one JSON type per property, so nothing is
      asserted; the kit's own styling goes through tabs.module.css, not
      through this.

# Internal structure this component composes that the kit does not expose
# as a component of its own.
unexposed_parts:
  - part: Base UI's Tabs.Indicator
    reason: >-
      TabsList renders exactly one Tabs.Indicator itself, right after its
      children, to draw the single bar that travels to the active trigger
      under the `line` variant; there is no exported part for it, and a list
      never holds more than one. The `default` variant marks its active
      trigger with a fill and a hairline instead and draws no bar at all.

examples:
  good:
    - title: A list of two triggers, default variant
      code: |
        <TabsList>
          <TabsTrigger value="account">Account</TabsTrigger>
          <TabsTrigger value="password">Password</TabsTrigger>
        </TabsList>
    - title: A flat, line-variant list at the small size
      code: |
        <TabsList variant="line" size="sm">
          <TabsTrigger value="general">General</TabsTrigger>
          <TabsTrigger value="billing">Billing</TabsTrigger>
        </TabsList>
  bad:
    - title: A TabsList with no Tabs root around it
      code: |
        <TabsList>
          <TabsTrigger value="a">A</TabsTrigger>
        </TabsList>
      why: >-
        TabsList reads and writes the nearest Tabs root's state through Base
        UI context; outside one, its triggers have no shared value to select
        or report.

family_membership:
  name: tabs
  role: part

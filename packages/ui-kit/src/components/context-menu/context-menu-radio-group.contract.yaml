# Semantic overlay for ContextMenuRadioGroup - a part of the ContextMenu
# family, see context-menu.contract.yaml's `family_membership` for how the
# fourteen contracts relate.
component: context-menu-radio-group

intent: Hold the one selected value shared by a set of ContextMenuRadioItem rows.

typical_uses:
  - A single-choice setting kept in the menu, such as a sort order or a view mode

dont_use_when:
  - situation: Settings that are each on or off independently
    instead:
      target: ContextMenuCheckboxItem
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_checkbox_item.v1
  - situation: A single choice that belongs to a form on the page
    instead:
      target: RadioGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.radio_group.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_label.v1 # ContextMenuLabel
    - gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_radio_item.v1 # ContextMenuRadioItem

invariants:
  - id: value-wins-over-default-value
    text: >-
      `value` and `defaultValue` are both accepted; `defaultValue` seeds the
      initial state and is ignored afterwards, and when `value` is given it
      wins and the component follows it on every render.
  - id: selects-by-item-value
    text: >-
      The item whose `value` is strictly equal (`===`) to the group's value is checked; activating
      another item reports that item's `value` through `onValueChange`.
  - id: disabled-cascades-to-every-item
    text: >-
      Setting `disabled` on the group disables every ContextMenuRadioItem
      inside it; an item's own `disabled` can disable that one item further
      but cannot re-enable it against a disabled group.
  - id: named-by-its-label
    text: >-
      The group renders `role="group"` and takes its accessible name from the
      ContextMenuLabel inside it, through `aria-labelledby`, unless the
      caller passes its own `aria-labelledby`.

anti_patterns: []

deprecations: {}

# context-menu.test.tsx asserts that clicking a radio item reports its value
# through onValueChange; it asserts no role on the group.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  children:
    states: children is the group's label and radio items
    because: >-
      `React.ReactNode` is a union of elements, strings, numbers, fragments
      and more, which the compiler cannot state as one JSON type.
  value:
    states: value is the selected item's value, of any type the caller chooses
    because: >-
      Typed `any` by the primitive, so no JSON Schema type can state what it
      holds; items are matched against it by their own `value`.
  defaultValue:
    states: defaultValue is the initially selected item's value, of any type the caller chooses
    because: >-
      Typed `any` by the primitive, so no JSON Schema type can state what it
      holds.
  onValueChange:
    states: onValueChange is a callback called with the chosen item's value and event details, not a value
    because: >-
      `(value: any, eventDetails) => void` - a function, which no JSON Schema
      type covers.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the group's
      own state, so its type is a union of a React element and a callback -
      neither expressible in JSON Schema.
  style:
    states: style accepts a function of the group's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled). A JSON Schema `object` would
      reject the function form, so nothing is asserted; the kit's own
      styling goes through context-menu.module.css, not through this.

examples:
  good:
    - title: A controlled view mode
      code: |
        <ContextMenuRadioGroup value={view} onValueChange={setView}>
          <ContextMenuLabel>View</ContextMenuLabel>
          <ContextMenuRadioItem value="list">List</ContextMenuRadioItem>
          <ContextMenuRadioItem value="grid">Grid</ContextMenuRadioItem>
        </ContextMenuRadioGroup>
    - title: An uncontrolled sort order
      code: |
        <ContextMenuRadioGroup defaultValue="name">
          <ContextMenuRadioItem value="name">Name</ContextMenuRadioItem>
          <ContextMenuRadioItem value="date">Date modified</ContextMenuRadioItem>
        </ContextMenuRadioGroup>
  bad:
    - title: The selected value set on an item instead of the group
      code: |
        <ContextMenuRadioGroup>
          <ContextMenuRadioItem value="list" checked>List</ContextMenuRadioItem>
          <ContextMenuRadioItem value="grid">Grid</ContextMenuRadioItem>
        </ContextMenuRadioGroup>
      why: >-
        A radio item has no `checked` prop; the selection lives on the group
        as `value` or `defaultValue`, and an item is checked when its own
        `value` matches it.

family_membership:
  name: context_menu
  role: part

# Semantic overlay for ContextMenuItem - a part of the ContextMenu family,
# see context-menu.contract.yaml's `family_membership` for how the fourteen
# contracts relate.
component: context-menu-item

intent: One action in a context menu, run when the user clicks or presses the row.

typical_uses:
  - A command on the right-clicked element, such as Rename, Duplicate or Delete

dont_use_when:
  - situation: A setting the user turns on or off
    instead:
      target: ContextMenuCheckboxItem
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_checkbox_item.v1
  - situation: One choice out of several mutually exclusive options
    instead:
      target: ContextMenuRadioItem
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_radio_item.v1
  - situation: A row that opens a further level of actions
    instead:
      target: ContextMenuSubTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_sub_trigger.v1
  - situation: A link to another page
    instead:
      target: a link outside the menu, such as the app router's link component
      note: >-
        The kit exports no link item for this menu; ContextMenuItem renders a
        div with the menuitem role, not a link.

# The row's caption arrives as text children, with an optional leading icon
# and a trailing ContextMenuShortcut.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu_shortcut.v1 # ContextMenuShortcut
  text: true

invariants:
  - id: activation-closes-the-menu
    text: >-
      Activating the item by pointer or by Enter calls `onClick` and closes
      the whole menu, unless `closeOnClick` is false.
  - id: disabled-stays-reachable
    text: >-
      A `disabled` row stays in arrow-key navigation and can take focus, but
      pressing it or pressing Enter on it does nothing.
  - id: destructive-keeps-its-red
    text: >-
      The destructive variant draws the text in the danger color at rest and
      while highlighted; only a light danger tint behind it marks the
      highlight.
  - id: descendant-svg-sized
    text: >-
      context-menu.module.css sizes every descendant `svg` of the row to the
      small icon size and keeps it from shrinking or taking pointer events,
      so a leading icon passed in children needs no size of its own.
  - id: inset-lines-up-with-icon-rows
    text: >-
      `inset` indents the item's text by the width of the icon column (the
      small icon size plus two spacing steps), so a row without an icon
      lines up with rows that start with one.

anti_patterns:
  - dont: Mark a reversible or everyday action with `variant="destructive"`
    do_instead: >-
      Keep `destructive` for an action that deletes or cannot be undone, so
      the red row stays a warning

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      context-menu.test.tsx asserts the item is found by role menuitem and
      its accessible name, that a disabled item carries data-disabled, and
      that clicking an item removes the menu
  rtl:
    outcome: unknown

prop_statements:
  onClick:
    states: onClick is a callback called with the click event when the item is activated by pointer or keyboard
    because: >-
      A React event handler - a function, which no JSON Schema type covers.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the item's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the item's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, highlighted). The compiler emits one JSON type per property, so nothing is asserted; the
      kit's own styling goes through context-menu.module.css, not through
      this.

examples:
  good:
    - title: An action with an icon and a shortcut hint
      code: |
        <ContextMenuItem onClick={onCopy}>
          <CopyIcon />
          Copy
          <ContextMenuShortcut>Ctrl+C</ContextMenuShortcut>
        </ContextMenuItem>
    - title: A destructive action and a disabled one
      code: |
        <ContextMenuContent>
          <ContextMenuItem disabled>Paste</ContextMenuItem>
          <ContextMenuItem variant="destructive" onClick={onDelete}>Delete</ContextMenuItem>
        </ContextMenuContent>
  bad:
    - title: A made-up onSelect handler for the action
      code: <ContextMenuItem onSelect={onDelete}>Delete</ContextMenuItem>
      why: >-
        The item has no `onSelect` prop; the name falls through to the
        forwarded `<div>` as the DOM's text-selection event, which a click
        on the row never fires. Run the action from `onClick`.

family_membership:
  name: context_menu
  role: part

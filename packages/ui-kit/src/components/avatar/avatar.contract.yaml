# Semantic overlay for Avatar (the root of the avatar family) - the
# hand-written half of one of four contracts describing this compound
# component. See avatar-image, avatar-fallback and avatar-badge for the
# parts. AvatarGroup and AvatarGroupCount share this directory but form a
# family of their own: a group wraps several Avatar roots and is not a part
# of any one of them (see avatar-group.contract.yaml).
#
# Machine-extractable facts (the prop list, the `size` axis and its default,
# the forwarded span surface) do NOT belong here: the compiler takes those
# from avatar.tsx and the Base UI Avatar primitive it wraps.
component: avatar

intent: Frame one person's or account's picture in a fixed-size circle and hold the load status its image and fallback share.

typical_uses:
  - The picture of a person or account beside their name
  - One member of a stacked group of participants

dont_use_when:
  - situation: A picture or icon with no person or account behind it
    instead:
      target: a plain img element or an icon
      note: >-
        Avatar exists for the image-or-fallback switch of an identity
        picture; a product thumbnail or a decorative glyph needs none of it.
  - situation: A placeholder while the record the avatar belongs to is itself still loading
    instead:
      target: Skeleton
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.skeleton.v1

# The ONE authored statement of the family's nesting: the compiler fills
# the three parts' `mounted_in` from this list. Plain text belongs in
# AvatarFallback, not directly in the root.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.avatar_image.v1 # AvatarImage
    - gts.frontx.uikit._.component.v1~frontx.uikit._.avatar_fallback.v1 # AvatarFallback
    - gts.frontx.uikit._.component.v1~frontx.uikit._.avatar_badge.v1 # AvatarBadge

# Kit mount points (AvatarGroup, MessageAvatar) are filled from those
# containers' own `accepts`; the entry below is the authored one, for an
# avatar that stands on its own with no kit container around it.
mounted_in:
  - container: any layout in the consuming application
    note: >-
      A single avatar sits beside a name or inside any row or header of the
      application; AvatarGroup is needed only to overlap several of them.

invariants:
  - id: one-load-status-per-root
    text: >-
      The root holds one image load status (idle, loading, loaded, error)
      that AvatarImage writes and AvatarFallback reads; it stays idle while
      no AvatarImage is mounted and returns to idle when the AvatarImage
      unmounts.
  - id: load-status-has-no-data-attribute
    text: >-
      The load status reaches no data attribute on the root or its parts;
      it is readable only through AvatarImage's `onLoadingStatusChange` and
      through the state the `render` and `style` functions receive.
  - id: size-drives-the-parts
    text: >-
      `size` sets the circle's width and height, and avatar.module.css
      reads the root's size class back in the parts: the badge's diameter
      steps with every size and the fallback's text takes the smaller meta
      text size at `sm`; the parts take no size of their own.
  - id: root-does-not-clip
    text: >-
      The root rounds itself but sets no `overflow: hidden`; the image and
      the fallback each round themselves, which is what lets AvatarBadge
      sit on the circle's edge without being cut off.

anti_patterns:
  - dont: Pass the picture's `src` or `alt` to Avatar itself
    do_instead: >-
      Put them on an AvatarImage inside the Avatar - the root is a span
      frame and renders no image of its own

deprecations: {}

# avatar.test.tsx asserts classes and the image/fallback switch only;
# the root renders a span with no role and nothing in the test asserts how
# assistive technology reads it.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the avatar's
      own state, so its type is a union of a React element and a callback -
      neither expressible in JSON Schema.
  style:
    states: style accepts a function of the avatar's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (imageLoadingStatus). A JSON Schema `object`
      would reject the function form, so nothing is asserted; the kit's own
      styling goes through avatar.module.css, not through this.

examples:
  good:
    - title: A picture with initials shown until it loads
      code: |
        <Avatar>
          <AvatarImage src="/jane.jpg" alt="Jane Doe" />
          <AvatarFallback>JD</AvatarFallback>
        </Avatar>
    - title: A large avatar with a status badge
      code: |
        <Avatar size="lg">
          <AvatarImage src="/jane.jpg" alt="Jane Doe" />
          <AvatarFallback>JD</AvatarFallback>
          <AvatarBadge />
        </Avatar>
  bad:
    - title: The image source passed to the root
      code: <Avatar src="/jane.jpg" alt="Jane Doe" />
      why: >-
        Avatar forwards to a span and declares no `src` or `alt`; nothing
        loads and the root renders an empty circle. The picture is an AvatarImage child, with
        an AvatarFallback beside it for while it loads or when it fails.

family_membership:
  name: avatar
  role: root

# Semantic overlay for AttachmentAction - part of the attachment family,
# see attachment.contract.yaml's `family_membership`. `mounted_in` is
# filled from AttachmentActions' accepted components, not authored here.
# AttachmentActionProps is ButtonProps, so every prop, axis and cva default
# the compiler reads comes from the kit Button (button.tsx).
component: attachment-action

intent: Trigger one action on the attachment, such as removing or downloading it, as a small ghost button.

typical_uses:
  - An icon-only remove or download button on an attached file

dont_use_when:
  - situation: An action that does not act on an attachment
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1
  - situation: Opening or previewing the whole attachment by clicking the card
    instead:
      target: AttachmentTrigger
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.attachment_trigger.v1

accepts:
  content: specified
  text: true
  icons_via: icon

invariants:
  - id: ghost-when-unset
    text: >-
      AttachmentAction renders Button's `ghost` variant when `variant` is
      not given or is null.
  - id: icon-only-needs-the-icon-prop-and-a-label
    text: >-
      The button is squared as icon-only only when the icon is passed
      through `icon` with no children (Button's `data-icon-only`); it
      then has no accessible name of its own and needs an `aria-label`.

anti_patterns:
  - dont: Leave an icon-only action without an `aria-label`
    do_instead: Name the action and its target, such as aria-label="Remove report.pdf"

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      attachment.test.tsx asserts that an AttachmentAction with
      aria-label="Remove" is found by role "button" with the accessible
      name "Remove"
  rtl:
    outcome: unknown

prop_statements:
  icon:
    states: icon is a React node, not a value
    because: >-
      `ReactNode` is a union of an element, a string, a number, a fragment,
      `false` and more - the compiler emits one JSON type per property. It
      is Button's icon slot, which sizes the icon, hides it while `loading`
      and marks it `aria-hidden`.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the button's
      own state, so its type is a union of a React element and a callback -
      the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the button's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled). The compiler emits one JSON type
      per property, so nothing is asserted; the kit's own styling goes
      through button.module.css and attachment.module.css, not through
      this.

examples:
  good:
    - title: An icon-only remove action
      code: <AttachmentAction icon={<XIcon />} aria-label="Remove report.pdf" />
  bad:
    - title: The icon passed as children
      code: |
        <AttachmentAction aria-label="Remove report.pdf">
          <XIcon />
        </AttachmentAction>
      why: >-
        Children are Button's label: the icon lands in the label span and
        the button is not squared as icon-only, since Button sets
        `data-icon-only` only for an `icon` with no children. Pass it
        through `icon`.

family_membership:
  name: attachment
  role: part

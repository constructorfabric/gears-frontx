# Semantic overlay for AttachmentGroup - the ninth contract of this
# directory. It belongs to no family: it wraps whole attachments, so it is
# not a part of the attachment family itself. AttachmentGroup declares one
# kit prop, `label`; every other prop is the native div's.
component: attachment-group

intent: Lay out several attachments in one horizontally scrolling, snapping row.

typical_uses:
  - The files attached to one message or waiting in a composer

dont_use_when:
  - situation: Attachments that should wrap onto several lines or stack in a column
    instead:
      target: a plain flex or grid container in the consuming application
      note: >-
        AttachmentGroup always lays its children out in one row that
        scrolls horizontally; the kit ships no wrapping attachment layout.
  - situation: Images or slides the user steps through one viewport at a time
    instead:
      target: Carousel
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.carousel.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.attachment.v1 # Attachment

invariants:
  - id: one-snapping-row
    text: >-
      The group is a flex row that scrolls horizontally with mandatory
      snapping and spaces its children var(--space-3) apart; each direct
      Attachment child keeps its own width and snaps to its start edge.
  - id: fade-and-hidden-scrollbar-need-utilities
    text: >-
      The group adds the global `scroll-fade-x` and `no-scrollbar` classes;
      the edge fade and the hidden scrollbar draw only when the package's
      utilities.css is loaded.
  # The id names the default: no label and a row that fits. Ids are never
  # removed at an unchanged contract major, so it stays and its text grows
  # the overflow and `label` behaviour, as item-description's clamp id does.
  - id: no-role-and-not-focusable
    text: >-
      Without `label` the group renders a div with no role and no name;
      `label` gives it role="group" and an aria-label (a group rather than
      a region, so that many attachment rows in one message list do not
      flood landmark navigation). While its content fits, the group has no
      tab stop of its own.
  - id: focus-stop-while-overflowing
    text: >-
      While its content overflows it horizontally, the group is a tab stop
      (tabIndex 0), so a keyboard user can scroll the row with the arrow
      keys. The overflow is re-measured when the group or one of its
      children resizes and when children are added or removed. A focused
      group keeps its tab stop until it loses focus, so focus never drops
      to the page body. A tabIndex the caller passes always wins. Keyboard focus draws the kit's focus
      ring, in the system Highlight color under forced colors, and drops
      the edge fade while the ring shows.

anti_patterns: []

deprecations: {}

# attachment.test.tsx asserts the group's classes, the tab stop against
# stubbed overflow widths, the caller's tabIndex and the label's role and
# name; jsdom lays nothing out, so the real overflow and arrow-key scrolling
# are not asserted there.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Two small attachments in a named row
      code: |
        <AttachmentGroup label="Attached files">
          <Attachment size="sm">
            <AttachmentContent>
              <AttachmentTitle>notes.txt</AttachmentTitle>
            </AttachmentContent>
          </Attachment>
          <Attachment size="sm">
            <AttachmentContent>
              <AttachmentTitle>diagram.png</AttachmentTitle>
            </AttachmentContent>
          </Attachment>
        </AttachmentGroup>
  bad:
    - title: A size set on the group
      code: |
        <AttachmentGroup size="sm">
          <Attachment />
        </AttachmentGroup>
      why: >-
        AttachmentGroup declares no `size` and its div surface has none, so
        TypeScript rejects it; the size belongs on each Attachment.

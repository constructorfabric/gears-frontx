# Semantic overlay for ItemSeparator - the one part of the item_group
# family, see item-group.contract.yaml's `family_membership`. It wraps the
# kit's own Separator (separator.tsx), which wraps the primitive's
# Separator, so its props are Separator's: `orientation`, `render` and
# `style` come from the primitive, `className` from the kit.
component: item-separator

intent: Draw a line between two rows of an item group.

typical_uses:
  - A divider between two Items inside an ItemGroup

dont_use_when:
  - situation: A divider between sections outside a group of items
    instead:
      target: Separator
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.separator.v1

# A divider is a line, not a container; item.test.tsx renders it
# self-closing.
accepts:
  content: nothing

invariants:
  - id: horizontal-with-block-margin
    text: >-
      ItemSeparator passes `orientation="horizontal"` to Separator before
      the consumer's own props, so it is horizontal unless the consumer
      passes an `orientation` of its own; it adds a var(--space-2) margin
      above and below on top of the group's gap.

anti_patterns:
  - dont: Leave a separator exposed to assistive technology inside the group's list
    do_instead: >-
      Pass aria-hidden="true" on ItemSeparator; the primitive's role
      separator is not a list item, and the rows' own boundaries already
      carry the structure

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the
      separator's own state, so its type is a union of a React element and a
      callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the separator's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (orientation). The compiler emits one JSON
      type per property, so nothing is asserted; the kit's own styling goes
      through item.module.css, not through this.

examples:
  good:
    - title: A decorative divider between two rows
      code: |
        <ItemGroup>
          <Item role="listitem">Q3 report.pdf</Item>
          <ItemSeparator aria-hidden="true" />
          <Item role="listitem">Notes.txt</Item>
        </ItemGroup>
  bad:
    - title: A plain Separator between rows
      code: |
        <ItemGroup>
          <Item>Q3 report.pdf</Item>
          <Separator />
          <Item>Notes.txt</Item>
        </ItemGroup>
      why: >-
        Separator is not a member of the group; ItemSeparator is the group's
        own divider and adds the block margin that spaces it from the rows.

family_membership:
  name: item_group
  role: part

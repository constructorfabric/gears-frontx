# Semantic overlay for Sidebar - the panel part of the sidebar family, see
# sidebar-provider.contract.yaml for the root.
component: sidebar

intent: The application shell's side panel, anchored to one edge and collapsible off-canvas or to an icon rail, shown as a slide-in sheet on narrow viewports.

typical_uses:
  - The persistent navigation panel of an application shell
  - A fixed-width side panel that never collapses (`collapsible="none"`)

dont_use_when:
  - situation: A horizontal site navigation with dropdown panels
    instead:
      target: NavigationMenu
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.navigation_menu.v1
  - situation: Switching between panels of one page
    instead:
      target: Tabs
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.tabs.v1
  - situation: A side panel that slides in for one task and is dismissed
    instead:
      target: Sheet
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sheet.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_header.v1 # SidebarHeader
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_content.v1 # SidebarContent
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_footer.v1 # SidebarFooter
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_separator.v1 # SidebarSeparator
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_rail.v1 # SidebarRail

invariants:
  - id: mobile-renders-a-sheet
    text: >-
      Below a 768px viewport, unless `collapsible` is `none`, the panel
      renders inside a Sheet opened by the provider's mobile state, with a
      visually hidden title "Sidebar"; the desktop element and its data
      attributes are not rendered.
  - id: collapsible-none-is-always-open
    text: >-
      With `collapsible="none"` the panel is a plain fixed-width column at
      every viewport; it ignores the provider's open state and never
      becomes a sheet. `side` and `variant` have no effect in this mode;
      the column sits where it is placed among the provider's children.
  - id: state-on-data-attributes
    text: >-
      On desktop, unless `collapsible` is `none`, the outer element carries `data-state` (`expanded` or
      `collapsed`), `data-variant`, `data-side`, and `data-collapsible`,
      which holds the `collapsible` value only while collapsed and is empty
      while expanded.
  - id: props-land-on-the-panel
    text: >-
      `className` and every other forwarded prop land on the fixed panel
      element inside the outer element on desktop, on the sheet's popup on
      mobile, and on the column itself with `collapsible="none"`.
  - id: reserves-its-width-in-flow
    text: >-
      The panel holds its width in the provider's row where it is placed,
      so a `side="right"` Sidebar goes after SidebarInset; an inset card
      then does not apply, because it only follows an earlier
      inset-variant Sidebar.
  - id: panel-is-fixed-to-the-viewport
    text: >-
      The desktop panel is `position: fixed`, so it resolves against the
      viewport unless an ancestor creates a containing block for fixed
      descendants (a `transform`, a `filter`, or `contain: layout paint`).

anti_patterns:
  - dont: Mount a Sidebar outside a SidebarProvider
    do_instead: Put it inside SidebarProvider - it reads the provider's state through useSidebar, which throws without one
  - dont: Place a Sidebar in a bounded box (a preview frame, a split pane) without a containing block
    do_instead: >-
      Give the box `contain: layout paint` or a `transform`, or the fixed panel pins itself to the viewport

deprecations: {}

# sidebar.test.tsx asserts the mobile panel appears as role dialog, but
# nothing about the desktop panel's semantics (a plain div, no landmark).
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: A panel collapsing to an icon rail, with its rail
      code: |
        <Sidebar collapsible="icon" variant="inset">
          <SidebarHeader>{workspaceSwitcher}</SidebarHeader>
          <SidebarContent>{groups}</SidebarContent>
          <SidebarFooter>{userMenu}</SidebarFooter>
          <SidebarRail />
        </Sidebar>
    - title: A panel that never collapses
      code: |
        <Sidebar collapsible="none">
          <SidebarContent>{details}</SidebarContent>
        </Sidebar>
  bad:
    - title: Styling expected on the outer element
      code: <Sidebar className={styles.wide} data-testid="nav">{panel}</Sidebar>
      why: >-
        `className` and `data-testid` land on the inner fixed panel, not on
        the element that carries `data-state`; a selector or query written
        against the outer element finds neither.

family_membership:
  name: sidebar
  role: part

# Semantic overlay for SidebarContent - a part of the sidebar family, see
# sidebar-provider.contract.yaml for the root.
component: sidebar-content

intent: The scrolling middle region of the sidebar panel that holds its sections.

typical_uses:
  - The column of navigation groups between the header and the footer

dont_use_when:
  - situation: Content that must stay visible while the sections scroll
    instead:
      target: SidebarHeader
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_header.v1
      note: Or SidebarFooter for the bottom of the panel.

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_group.v1 # SidebarGroup
    - gts.frontx.uikit._.component.v1~frontx.uikit._.sidebar_separator.v1 # SidebarSeparator
    - gts.frontx.uikit._.component.v1~frontx.uikit._.collapsible.v1 # Collapsible, around a SidebarGroup that opens and closes

invariants:
  - id: fills-and-scrolls
    text: >-
      SidebarContent grows to fill the panel height left by the header and
      the footer and scrolls its own overflow; collapsed to the icon rail
      its overflow is hidden instead.

anti_patterns: []

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Groups in the scrolling region
      code: |
        <SidebarContent>
          <SidebarGroup>
            <SidebarGroupLabel>Platform</SidebarGroupLabel>
            <SidebarGroupContent>{menu}</SidebarGroupContent>
          </SidebarGroup>
        </SidebarContent>
  bad:
    - title: A menu straight in the content region
      code: |
        <SidebarContent>
          <SidebarMenu>{items}</SidebarMenu>
        </SidebarContent>
      why: >-
        Without a SidebarGroup around a SidebarMenu the rows lose the group's
        8px padding, so they touch the panel edges and do not centre in the
        icon rail.

family_membership:
  name: sidebar
  role: part

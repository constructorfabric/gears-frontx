component: grid

intent: Arrange an ordered group of blocks in responsive size-class bands without asking callers for spans.

typical_uses:
  - A group of dashboard blocks with shared responsive sizing rules
  - An ordered collection of mixed high and low panels

dont_use_when:
  - situation: Callers need exact manual placement
    instead:
      target: Native CSS grid

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.grid_item.v1

invariants:
  - id: stable-order
    text: Items keep input DOM order while the grid places each size class's preferred span at each container step, or an in-range span when flexible.
  - id: named-container
    text: The outer wrapper is a named inline-size container; step rules are scoped to the config name.

anti_patterns:
  - dont: Put a fragment or wrapper between Grid and GridItem
    do_instead: Pass direct GridItem elements or arrays of them.

prop_statements:
  children:
    states: children are direct GridItem elements, arrays, or empty conditional entries
    because: ReactNode includes wrappers, fragments, and text that Grid rejects at runtime.
  config:
    states: config is an immutable GridConfig shared with its generated step CSS, including the fixed row track
    because: The schema cannot express the nested step-to-size-range relationship or CSS generation contract.

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: An ordered block group
      code: <Grid><GridItem layoutId="one" size="large">One</GridItem></Grid>
  bad:
    - title: A nested wrapper
      code: <Grid><div><GridItem layoutId="one" size="large">One</GridItem></div></Grid>
      why: Grid accepts direct items only.

family_membership:
  name: grid
  role: root

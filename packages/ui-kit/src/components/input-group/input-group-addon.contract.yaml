# Semantic overlay for InputGroupAddon - a part of the InputGroup family, see
# input-group.contract.yaml.
component: input-group-addon

intent: Hold the icons, text and compact actions attached to one side of an InputGroup's field.

typical_uses:
  - A leading or trailing cluster on the field's row (an icon, a prefix, a clear button)
  - A full-width row above or below a multi-line field (a recipient line, a character counter, a toolbar)

dont_use_when:
  - situation: A caption naming the field, outside its frame
    instead:
      target: FieldLabel
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.field_label.v1

# A bare string, a Kbd or an icon dropped straight into an addon takes the
# addon's own muted Label metrics (input-group.module.css `.group .addon`).
# A bare svg child is also meant (see direct-svg-sized-by-the-group), but the
# accepts vocabulary has no term for it yet; recorded as a harness gap.
accepts:
  content: specified
  text: true
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.input_group_button.v1 # InputGroupButton
    - gts.frontx.uikit._.component.v1~frontx.uikit._.input_group_text.v1 # InputGroupText
    - gts.frontx.uikit._.component.v1~frontx.uikit._.kbd.v1 # Kbd, a shortcut hint

invariants:
  - id: click-outside-a-button-focuses-the-field
    text: >-
      A click in the addon that does not land inside a button focuses the
      first input or textarea in the addon's parent element, then calls the
      consumer's `onClick`; a click inside a button is not redirected, and
      the consumer's `onClick` is called either way.
  - id: align-moves-visually-not-in-the-dom
    text: >-
      `align` places the addon with CSS `order`: `inline-start` and
      `inline-end` share the field's row on either side, `block-start` and
      `block-end` take a full-width row above or below it, and both axes can
      be used in one group. The DOM order, and so the reading and tab order,
      stays the order the consumer wrote.
  - id: direct-svg-sized-by-the-group
    text: >-
      An svg that is a direct child of the addon is sized to the group's
      step icon box (16px at `sm` and `default`, 20px at `lg`); an icon
      nested deeper, inside a Kbd or an InputGroupButton, keeps its own size.

anti_patterns:
  - dont: Place an `inline-end` addon before the field in the markup
    do_instead: >-
      Write addons in the order they read - leading addon, field, trailing
      addon; `align` only moves the box visually, so a trailing action
      written first is reached by Tab before the field it follows

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Trailing shortcut hint
      code: |
        <InputGroup>
          <InputGroupInput type="search" placeholder="Search" aria-label="Search" />
          <InputGroupAddon align="inline-end">
            <Kbd>Ctrl K</Kbd>
          </InputGroupAddon>
        </InputGroup>
    - title: Counter row under a multi-line field
      code: |
        <InputGroup>
          <InputGroupTextarea placeholder="Notes" aria-label="Notes" />
          <InputGroupAddon align="block-end">
            <InputGroupText>0/280</InputGroupText>
          </InputGroupAddon>
        </InputGroup>
  bad:
    - title: Alignment named after physical sides
      code: <InputGroupAddon align="right">USD</InputGroupAddon>
      why: >-
        `align` takes logical values only (`inline-start`, `inline-end`,
        `block-start`, `block-end`); a trailing addon is `inline-end`.

family_membership:
  name: input_group
  role: part

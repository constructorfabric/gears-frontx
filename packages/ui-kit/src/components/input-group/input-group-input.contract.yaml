# Semantic overlay for InputGroupInput - a part of the InputGroup family, see
# input-group.contract.yaml. It renders the kit's Input with the group's
# control class, so its props are Input's own.
component: input-group-input

intent: The single-line text field an InputGroup frames, drawn without chrome of its own.

typical_uses:
  - The field of an InputGroup with a prefix, suffix or attached action

dont_use_when:
  - situation: A single-line field with no InputGroup around it
    instead:
      target: Input
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.input.v1
  - situation: Multi-line text inside an InputGroup
    instead:
      target: InputGroupTextarea
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.input_group_textarea.v1

# A native input takes no children.
accepts:
  content: nothing

invariants:
  - id: value-wins-over-default-value
    text: >-
      `value` and `defaultValue` are both accepted; `defaultValue` seeds the
      initial state and is ignored afterwards, and when `value` is given it
      wins and the component follows it on every render.
  - id: chrome-belongs-to-the-group
    text: >-
      Inside an InputGroup the field's own border, background, radius and
      focus or invalid ring are removed and it stretches to fill the row;
      its `:focus-visible`, `aria-invalid="true"` and `:disabled` states
      are what the surrounding group draws.

anti_patterns:
  - dont: Pass `icon` or `end` to InputGroupInput
    do_instead: >-
      Put the icon or action in an InputGroupAddon; with a slot, Input wraps
      the field in a span that input-group.module.css does not lay out as the
      group's flexible field

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      input-group.test.tsx resolves the field by getByRole('textbox', { name:
      'Amount' }) from its aria-label, and asserts that clicking an addon
      moves document.activeElement to it
  rtl:
    outcome: unknown

prop_statements:
  icon:
    states: icon is a React node, not a value
    because: >-
      `ReactNode` is a union, and the compiler emits one JSON type per property - an element, a string,
      a fragment and `false` are all valid and only tsc can tell them from a
      mistake. It is Input's decorative leading slot, reaching this part
      unchanged.
  end:
    states: end is a React node, not a value
    because: >-
      `ReactNode` is a union, and the compiler emits one JSON type per property - an element, a string,
      a fragment and `false` are all valid and only tsc can tell them from a
      mistake. It is Input's live trailing slot, reaching this part
      unchanged.
  value:
    states: value is the controlled field value, a string, a number or a readonly array of strings
    because: >-
      React types a native input's value as this three-way union; the schema
      asserts nothing for it, so the TypeScript type is the statement and
      tsc is the checker.
  defaultValue:
    states: defaultValue is the uncontrolled field's initial value, a string, a number or a readonly array of strings
    because: >-
      React types a native input's value as this three-way union; the schema
      asserts nothing for it, so the TypeScript type is the statement and
      tsc is the checker.
  onValueChange:
    states: onValueChange is a function called with the next value and event details, not a value
    because: >-
      A function type has no JSON Schema representation. Its second argument
      carries Base UI's own change-event-details shape (a reason, the
      triggering native event, and controls to cancel the change or allow it
      to propagate), which only tsc can check.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the input's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the input's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (disabled, focused, filled, valid, ...). The compiler emits one JSON type per property, so nothing is
      asserted; the kit's own styling goes through input.module.css and
      input-group.module.css, not through this.

unexposed_parts:
  - part: Input's presentational wrapper, icon and end spans
    reason: >-
      InputGroupInput renders the kit's Input, which adds these spans only
      when `icon` or `end` is given; they carry no behavior a consumer
      reaches, and inside a group addons replace them.

examples:
  good:
    - title: Controlled field with a unit suffix
      code: |
        <InputGroup>
          <InputGroupInput type="number" value={width} onValueChange={setWidth} aria-label="Width" />
          <InputGroupAddon align="inline-end">
            <InputGroupText>px</InputGroupText>
          </InputGroupAddon>
        </InputGroup>
    - title: Invalid field, the group draws the error border
      code: |
        <InputGroup>
          <InputGroupAddon>
            <InputGroupText>@</InputGroupText>
          </InputGroupAddon>
          <InputGroupInput aria-label="Email" aria-invalid aria-describedby="email-error" />
        </InputGroup>
  bad:
    - title: Icon passed through Input's slot instead of an addon
      code: |
        <InputGroup>
          <InputGroupInput icon={<SearchIcon />} aria-label="Search" />
          <InputGroupAddon align="inline-end">
            <InputGroupButton icon={<XIcon />} aria-label="Clear" />
          </InputGroupAddon>
        </InputGroup>
      why: >-
        The slot wraps the field in a span that takes a full row of the
        group, so the trailing addon no longer shares the field's line. Put
        the icon in a leading InputGroupAddon.

family_membership:
  name: input_group
  role: part

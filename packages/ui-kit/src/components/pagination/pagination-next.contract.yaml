# Semantic overlay for PaginationNext - part of the Pagination family, see
# pagination.contract.yaml. `mounted_in` is filled from PaginationItem's
# own accepted components, not authored here. It renders a PaginationLink
# with `square` fixed off, so it shares that part's anchor, `isActive` and
# router behaviour.
component: pagination-next

intent: Link to the next page of a paged result set with a chevron and a short label.

typical_uses:
  - The next link at the end of the page row
  - Half of a previous/next pair with no page numbers

dont_use_when:
  - situation: A link to one numbered page
    instead:
      target: PaginationLink
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_link.v1
  - situation: A link to the previous page
    instead:
      target: PaginationPrevious
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_previous.v1

accepts:
  content: nothing

invariants:
  - id: fixed-content-and-accessible-name
    text: >-
      The link renders the label before a right chevron and ignores children.
      Its accessible name is the fixed `aria-label` "Go to next page", set
      ahead of the consumer's props: `text` changes only the visible label,
      and only an `aria-label` passed to it replaces the name.
  - id: label-hidden-below-640px
    text: >-
      The visible label is hidden below a 640px viewport width
      (pagination.module.css `.previousNextText`), so a narrow viewport shows
      the chevron alone.

anti_patterns:
  - dont: Relabel the link through `text` alone
    do_instead: Pass a matching `aria-label` with a custom `text`, so the visible label stays part of the accessible name

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      pagination.test.tsx asserts getByRole('link', { name: 'Go to next page'
      }) finds the link while its visible text is the custom `text` "Forward"
  rtl:
    outcome: failed
    by: >-
      pagination.tsx renders ChevronRightIcon in the link and
      pagination.module.css has no rule that mirrors it under a right-to-left
      direction, so in a right-to-left row it points against the reading order

unexposed_parts:
  - part: the chevron icon
    reason: >-
      pagination.tsx renders a ChevronRightIcon inside the link; it is not
      exported as a component of its own and cannot be replaced.
  - part: the visible label span
    reason: >-
      pagination.tsx renders `text` in a span with the stylesheet's
      previousNextText class; it is not exported, and `text` is the only
      control over it.

examples:
  good:
    - title: The default label
      code: <PaginationNext href="?page=3" />
    - title: A custom label with a matching accessible name
      code: <PaginationNext href="?page=3" text="Older" aria-label="Go to older results" />
  bad:
    - title: A label given as children
      code: <PaginationNext href="?page=3">Forward</PaginationNext>
      why: >-
        The link renders fixed content and ignores children; the visible label
        is set through `text`.

family_membership:
  name: pagination
  role: part

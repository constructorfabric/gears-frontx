# Semantic overlay for Checkbox - the hand-written half of the contract.
#
# Machine-extractable facts (prop list, defaults, forwarded surface) do NOT
# belong here: the compiler takes those from checkbox.tsx and the Base UI
# Checkbox primitive it wraps, and rejects an overlay that tries to restate
# them - one fact, one owner. This file carries only what the code cannot
# express: intent, boundaries, invariants.
component: checkbox

intent: Let a user opt in or out of one independent option, tracked as part of a form's state.

typical_uses:
  - An option independent of any other, where several may be on at once
  - A choice staged in a form that takes effect on submit

dont_use_when:
  - situation: An immediate on/off with instant effect
    instead:
      target: Switch
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.switch.v1
  - situation: Mutually exclusive options, only one of which may be on
    instead:
      target: RadioGroup
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.radio_group.v1

# CheckboxProps declares no children field and the component renders only its
# own indicator/icons internally - there is no slot for anything a consumer
# passes. The label sits beside the checkbox, not inside it (see examples).
accepts:
  content: nothing

invariants:
  - id: checked-wins-over-default-checked
    text: >-
      `checked` and `defaultChecked` are both accepted; `defaultChecked`
      seeds the initial state and is ignored afterwards, and when `checked`
      is given it wins and the component follows it on every render.
  - id: indeterminate-overrides-the-reported-checked-state
    text: >-
      `indeterminate` is independent of `checked` in the props, but not in
      what gets reported: while `indeterminate` is true the box renders the
      minus mark and `aria-checked` reads "mixed" regardless of `checked`'s
      own value, matching the WAI-ARIA mixed-state convention for a
      "some children selected" parent.

anti_patterns:
  - dont: Put the label text where children would go
    do_instead: Checkbox takes no content; wrap the box and the label text together in `Label` so the two share one click target
  - dont: Pass `checked` with no `onCheckedChange`
    do_instead: A controlled box with no change handler never receives its own toggle back - pair `checked` with `onCheckedChange`, or drop both and use `defaultChecked` for an uncontrolled box

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      Base UI's own Checkbox primitive (role="checkbox", keyboard toggling, a
      hidden native input for form submission, aria-checked including
      "mixed") plus checkbox.test.tsx's own role/aria-checked/data-disabled
      assertions
  rtl:
    outcome: unknown

# Internal structure this component composes that the kit does not expose as
# a component of its own.
unexposed_parts:
  - part: Base UI's Checkbox.Indicator
    reason: >-
      checkbox.tsx renders it directly inside its own Root wrapper to draw
      the box and its two marks, the check and the minus that swap on the
      indicator's data-indeterminate state; it is not exported as a
      component of its own, so a consumer cannot reach or replace it
      independently - only the whole Checkbox.

# What each property that reaches this contract asserting nothing (or only
# part of its shape) actually states, and why - keyed on the property
# itself. The compiler emits both halves into that property's own
# description, beside the `TS:` text.
prop_statements:
  onCheckedChange:
    states: onCheckedChange is a function called with the next checked value and event details, not a value
    because: >-
      A function type has no JSON Schema representation. Its second argument
      carries Base UI's own change-event-details shape (a reason, the
      triggering native event, and controls to cancel the change or allow it
      to propagate), which only tsc can check.
  inputRef:
    states: inputRef is a ref to the hidden native input Base UI renders for form submission
    because: >-
      `React.Ref<HTMLInputElement>` is a union of a ref object and a callback
      function - the compiler emits one JSON type per property. It exists so a
      consumer can read or focus the native input directly, the same input
      `name`/`value`/`uncheckedValue` submit through.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the checkbox's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the checkbox's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (checked, disabled, indeterminate, ...). The compiler emits one JSON type per property, so nothing is
      asserted; the kit's own styling goes through checkbox.module.css, not
      through this.

examples:
  good:
    - title: Labelled checkbox, one click target
      code: |-
        <Label>
          <Checkbox name="terms" required /> I agree to the terms
        </Label>
    - title: Indeterminate, for a "some children selected" parent
      code: <Checkbox indeterminate aria-label="Select all" />
  bad:
    - title: Label text passed as children
      code: <Checkbox>I agree to the terms</Checkbox>
      why: >-
        Checkbox takes no content - there is no slot for it. Wrap the box and
        the text together in `Label` instead, which is also what gives the
        pair one shared click target.
    - title: Controlled with no change handler
      code: <Checkbox checked={true} aria-label="Terms" />
      why: >-
        `checked` with no `onCheckedChange` never gets its own toggle back,
        so the box is stuck controlled and never responds to a click. Pair
        `checked` with `onCheckedChange`, or use `defaultChecked` instead.

# Semantic overlay for PageHeaderActions - part of the PageHeader family,
# see page-header.contract.yaml's `family_membership` for how the eight
# contracts relate. `mounted_in` is filled from PageHeader's own accepted
# components, not authored here.
component: page-header-actions

intent: Lay out the controls the page is worked with at the end of the header.

typical_uses:
  - The page's primary button, such as "New project"
  - A row of buttons with a menu of further actions

dont_use_when:
  - situation: Navigation between the sections of the page
    instead:
      target: PageHeaderMeta
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.page_header_meta.v1
  - situation: The actions of a card
    instead:
      target: CardFooter
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.card_footer.v1

# Buttons, a dropdown menu, a dialog trigger, a toggle group or a control of
# the consumer's own are all drawn here, so the slot is not constrained to a
# list.
accepts:
  content: unconstrained

invariants:
  - id: unshrinking-row-at-the-end
    text: >-
      PageHeaderActions is a flex row that centers its children vertically,
      spaces them var(--space-2) apart, does not shrink, and wraps its
      children onto further lines, var(--space-2) apart, when they do not
      fit; the root's gap plus its own var(--space-2) margin puts
      var(--space-6) between it and the text block.
  - id: own-line-when-narrow
    text: >-
      When the header's width inside its side insets is below 64rem it takes
      a line of its own, flush with the start of the header.

anti_patterns:
  - dont: Add a margin to space the actions from the title
    do_instead: >-
      Leave it - the root's gap and the part's own margin already make the
      drawn var(--space-6), and a margin of yours would add to it
  - dont: Put the page's section navigation at the end of the header
    do_instead: Put it beside the title, in PageHeaderMeta

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

examples:
  good:
    - title: Two buttons and a menu of further actions
      code: |
        <PageHeaderActions>
          <Button variant="outline">Edit dashboard</Button>
          <Button>New project</Button>
          <Button variant="ghost" icon={<EllipsisIcon />} aria-label="More actions" />
        </PageHeaderActions>
  bad:
    - title: Section links set among the actions
      code: |
        <PageHeaderActions>
          <a href="/components/gears">Gears</a>
          <a href="/components/plan">Plan</a>
          <Button>Create Gear</Button>
        </PageHeaderActions>
      why: >-
        Navigation between the page's sections belongs beside the title it
        divides, in PageHeaderMeta; among the actions it reads as one more
        command and loses its tie to the title.

family_membership:
  name: page_header
  role: part

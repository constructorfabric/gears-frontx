# Semantic overlay for DropdownMenu (the root) - the hand-written half of one
# of fourteen contracts describing this compound component. The parts are the
# other dropdown-menu-*.contract.yaml files in this directory; see
# `family_membership` below for how a reader walks between them.
#
# Machine-extractable facts (prop list, defaults) do NOT belong here: the
# compiler takes those from dropdown-menu.tsx and the Base UI Menu.Root it
# re-exports. The root renders no element of its own, so it names no element
# surface.
component: dropdown-menu

intent: Hold the open state of one menu of actions and tie the trigger that opens it to the popup that lists them.

typical_uses:
  - A "more actions" button on a row, a card or a toolbar
  - An account menu behind an avatar or a user name

dont_use_when:
  - situation: Picking one value for a form field from a fixed list
    instead:
      target: Select
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.select.v1
  - situation: A menu opened by right-clicking or long-pressing an area rather than by a trigger button
    instead:
      target: ContextMenu
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.context_menu.v1
  - situation: A persistent horizontal row of application menus, such as File, Edit and View
    instead:
      target: Menubar
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.menubar.v1
  - situation: A long list of commands the user filters by typing
    instead:
      target: Command
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.command.v1
  - situation: A floating panel with fields or other controls to operate
    instead:
      target: Popover
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.popover.v1
  - situation: Site or application navigation between pages
    instead:
      target: NavigationMenu
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.navigation_menu.v1

# The ONE authored statement of the root's nesting: the compiler fills the
# trigger's and the content's `mounted_in` from this list.
accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_trigger.v1 # DropdownMenuTrigger
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_content.v1 # DropdownMenuContent

invariants:
  - id: open-wins-over-default-open
    text: >-
      `open` and `defaultOpen` are both accepted; `defaultOpen` seeds the
      initial state and is ignored afterwards, and when `open` is given it
      wins and the component follows it on every render.
  - id: escape-and-outside-press-close
    text: >-
      While open, pressing Escape or pressing outside the popup closes the
      menu and reports the change through `onOpenChange`.
  - id: modal-blocks-the-page
    text: >-
      While a modal menu (`modal`, true when not given) is open, page scroll
      is locked and pointer interaction with elements outside the menu is
      disabled; with `modal={false}` the rest of the page stays usable,
      except while the menu was opened by hovering a trigger with
      `openOnHover`, which neither locks scroll nor blocks the page.

anti_patterns:
  - dont: Hold the open state in the caller and pass `open` without `onOpenChange`
    do_instead: >-
      Pass `onOpenChange` alongside `open` and update the state from it, or
      leave both out; a controlled `open` that nothing updates keeps the
      menu from opening on a trigger press or closing on Escape

deprecations: {}

# The root renders no element; the roles and keyboard behaviour live on its
# parts, whose own contracts attest them.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  children:
    states: children is the root's content, either React nodes or a function of the active trigger's payload that returns them
    because: >-
      `React.ReactNode | PayloadChildRenderFunction<Payload>` - the function
      form receives `{ payload }` from whichever trigger opened the menu. A
      React node and a function have no JSON Schema representation.
  onOpenChange:
    states: onOpenChange is a callback called with the next open state and event details, not a value
    because: >-
      `(open: boolean, eventDetails) => void`; the second argument carries
      Base UI's change-event details, including the reason (such as a
      trigger press, an item press, an outside press or Escape). No JSON
      Schema type covers a function.
  onOpenChangeComplete:
    states: onOpenChangeComplete is a callback called with the open state once the open or close animation has finished
    because: >-
      `(open: boolean) => void` - a function, which no JSON Schema type
      covers.
  actionsRef:
    states: actionsRef is a ref the root fills with imperative `close` and `unmount` actions
    because: >-
      `React.RefObject<MenuRoot.Actions | null>` - a ref object holding
      functions, which no JSON Schema type covers.
  handle:
    states: handle is an opaque object from the primitive's Menu.createHandle(), shared with a trigger placed outside this root
    because: >-
      `MenuHandle<Payload>` is a class instance holding the menu's store,
      not data; the kit re-exports no createHandle, so a caller imports it
      from the primitive.
  triggerId:
    states: triggerId is the id of the trigger a controlled menu is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.
  defaultTriggerId:
    states: defaultTriggerId is the id of the trigger an initially open menu is open for, or null
    because: >-
      `string | null` - the compiler emits one JSON type per property, so a
      string-or-null union is left unasserted.

examples:
  good:
    - title: A menu of row actions behind an outline button
      code: |
        <DropdownMenu>
          <DropdownMenuTrigger render={<Button variant="outline" />}>Actions</DropdownMenuTrigger>
          <DropdownMenuContent>
            <DropdownMenuItem onClick={onRename}>Rename</DropdownMenuItem>
            <DropdownMenuItem variant="destructive" onClick={onDelete}>Delete</DropdownMenuItem>
          </DropdownMenuContent>
        </DropdownMenu>
    - title: A menu opened from state the caller owns
      code: |
        <DropdownMenu open={open} onOpenChange={setOpen}>
          <DropdownMenuTrigger>Account</DropdownMenuTrigger>
          <DropdownMenuContent>
            <DropdownMenuItem onClick={onSignOut}>Sign out</DropdownMenuItem>
          </DropdownMenuContent>
        </DropdownMenu>
  bad:
    - title: A reading direction passed to the root, as an older menu library took it
      code: |
        <DropdownMenu dir="rtl">
          <DropdownMenuTrigger>Actions</DropdownMenuTrigger>
          <DropdownMenuContent>
            <DropdownMenuItem>Rename</DropdownMenuItem>
          </DropdownMenuContent>
        </DropdownMenu>
      why: >-
        The root takes no `dir`; the menu's arrow-key navigation reads the
        reading direction from the nearest DirectionProvider, so wrap the
        right-to-left subtree in one instead.

family_membership:
  name: dropdown_menu
  role: root

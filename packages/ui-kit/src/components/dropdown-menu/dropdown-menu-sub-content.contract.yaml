# Semantic overlay for DropdownMenuSubContent - a part of the DropdownMenu
# family, see dropdown-menu.contract.yaml's `family_membership` for how the
# contracts relate. It renders a DropdownMenuContent with its own placement
# defaults and the submenu popup class; the forwarded surface is the Popup's
# div.
component: dropdown-menu-sub-content

intent: The popup of a submenu, portalled and positioned beside its DropdownMenuSubTrigger, that lists the submenu's items.

typical_uses:
  - The second-level list of actions behind a DropdownMenuSubTrigger

dont_use_when:
  - situation: The first-level popup opened by a DropdownMenuTrigger
    instead:
      target: DropdownMenuContent
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_content.v1

accepts:
  content: specified
  components:
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_group.v1 # DropdownMenuGroup
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_item.v1 # DropdownMenuItem
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_checkbox_item.v1 # DropdownMenuCheckboxItem
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_radio_group.v1 # DropdownMenuRadioGroup
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_separator.v1 # DropdownMenuSeparator
    - gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_sub.v1 # DropdownMenuSub

invariants:
  - id: rendered-only-while-open
    text: >-
      The submenu popup is in the DOM only while its submenu is open or
      animating closed; the kit passes no `keepMounted` to the portal.
  - id: inherits-the-parent-container
    text: >-
      Without `container`, the submenu popup portals into the container its
      enclosing DropdownMenuContent or DropdownMenuSubContent resolved, so a
      theme passed to the
      first-level popup holds in the submenu; its own `container` wins
      when given.
  - id: sized-to-its-content
    text: >-
      dropdown-menu.module.css sizes the submenu popup to its own content
      with an 8rem floor, not to the width of its sub-trigger.
  - id: opens-on-the-physical-right
    text: >-
      The submenu opens on the physical right of its sub-trigger unless
      `side` says otherwise; the default does not flip in a right-to-left
      layout.
  - id: reduced-motion-keeps-the-fade
    text: >-
      The popup fades and scales on open and close; under
      `prefers-reduced-motion` dropdown-menu.module.css drops the transform
      transition and keeps the fade.

anti_patterns:
  - dont: Chain submenus more than one level deep
    do_instead: >-
      Flatten the deeper level into a group or radio group inside this
      popup; each extra level is another popup to reach by hover or arrow
      keys

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      the primitive's Menu.Popup renders role="menu"; dropdown-menu.test.tsx
      asserts the submenu item's closest [role="menu"] ancestor carries the
      submenu popup class
  rtl:
    outcome: unknown

unexposed_parts:
  - part: Menu.Portal
    reason: Composed through DropdownMenuContent; only its `container` is exposed, as a prop of the submenu popup itself.
  - part: Menu.Positioner
    reason: Composed through DropdownMenuContent; its placement and collision props are exposed on the submenu popup itself.

prop_statements:
  children:
    states: children is the submenu popup's rows, the parts listed under accepts
    because: >-
      `React.ReactNode` is a union of elements, strings, numbers, fragments
      and more; the compiler emits one JSON type per property.
  container:
    states: container is the DOM node, shadow root or ref to one that the popup portals into; null and undefined both mean no container of its own
    because: >-
      `HTMLElement | ShadowRoot | RefObject<HTMLElement | ShadowRoot | null> | null`
      - live DOM nodes and ref objects, which no JSON Schema type covers. The
      kit resolves it as `container ?? <the enclosing content's container>`,
      so an explicit null falls through like an absent prop.
  sideOffset:
    states: sideOffset is the gap in pixels between the anchor and the popup, as a number or a function of side, align and both boxes' sizes
    because: >-
      `number | OffsetFunction` - the compiler emits one JSON type per
      property, and the function form has no JSON Schema representation.
  alignOffset:
    states: alignOffset is the shift in pixels along the alignment axis, as a number or a function of side, align and both boxes' sizes
    because: >-
      `number | OffsetFunction` - the compiler emits one JSON type per
      property, and the function form has no JSON Schema representation.
  collisionBoundary:
    states: collisionBoundary is the area the popup is kept inside, `clipping-ancestors`, an element, a list of elements or a rectangle
    because: >-
      `'clipping-ancestors' | Element | Element[] | Rect` mixes a string with
      live DOM elements, which no JSON Schema type covers.
  collisionPadding:
    states: collisionPadding is the space in pixels kept from the collision boundary, one number or a per-side object
    because: >-
      `number | { top?, right?, bottom?, left? }` - the compiler emits one
      JSON type per property.
  finalFocus:
    states: finalFocus decides where focus goes when the popup closes - true for the default, false for nowhere, a ref, or a function of the interaction type
    because: >-
      `boolean | RefObject<HTMLElement | null> | ((closeType) => boolean | HTMLElement | null | void)`
      mixes a boolean with a ref object and a callback; the compiler emits
      one JSON type per property.
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the popup's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the popup's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (open, side, align, nested, instant,
      transitionStatus). The compiler emits one JSON type per property, so nothing is asserted; the kit's own styling goes through
      dropdown-menu.module.css, not through this.

examples:
  good:
    - title: A submenu of sharing targets
      code: |
        <DropdownMenuSub>
          <DropdownMenuSubTrigger>Share</DropdownMenuSubTrigger>
          <DropdownMenuSubContent>
            <DropdownMenuItem>Email</DropdownMenuItem>
            <DropdownMenuItem>Copy link</DropdownMenuItem>
          </DropdownMenuSubContent>
        </DropdownMenuSub>
  bad:
    - title: A DropdownMenuContent used as the submenu popup
      code: |
        <DropdownMenuSub>
          <DropdownMenuSubTrigger>Share</DropdownMenuSubTrigger>
          <DropdownMenuContent>
            <DropdownMenuItem>Email</DropdownMenuItem>
          </DropdownMenuContent>
        </DropdownMenuSub>
      why: >-
        DropdownMenuContent keeps the first-level placement and sizing, so
        the submenu opens below the sub-trigger, over the rows beneath it, at
        the sub-trigger's width; DropdownMenuSubContent opens beside the
        sub-trigger and sizes to its content.

family_membership:
  name: dropdown_menu
  role: part

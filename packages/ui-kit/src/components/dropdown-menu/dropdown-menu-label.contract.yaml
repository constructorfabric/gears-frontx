# Semantic overlay for DropdownMenuLabel - a part of the DropdownMenu family,
# see dropdown-menu.contract.yaml's `family_membership` for how the contracts
# relate. The forwarded surface is the primitive's div.
component: dropdown-menu-label

intent: The caption of a DropdownMenuGroup or DropdownMenuRadioGroup, shown above its items and used as the group's accessible name.

typical_uses:
  - A section caption such as "Account" or "Sort by"

dont_use_when:
  - situation: The caption of a form control outside a menu
    instead:
      target: Label
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.label.v1
  - situation: A menu row the user can activate
    instead:
      target: DropdownMenuItem
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.dropdown_menu_item.v1

# `mounted_in` is filled from the groups that accept it.
accepts:
  content: specified
  text: true

invariants:
  - id: throws-outside-a-group
    text: >-
      Rendering the label outside a DropdownMenuGroup or DropdownMenuRadioGroup
      throws; the primitive looks up the group it labels from context.
  - id: names-the-group-not-itself
    text: >-
      The label renders `role="presentation"` and gives its id to the
      enclosing group's `aria-labelledby`; it is not focusable and is
      skipped by arrow-key navigation.

anti_patterns:
  - dont: Style a DropdownMenuItem with `disabled` to act as a caption
    do_instead: >-
      Use a DropdownMenuLabel inside a group; a disabled item is still
      reached by arrow keys and announced as a menu item

deprecations: {}

# dropdown-menu.test.tsx asserts the label's class and that it throws outside
# a group; nothing asserts the presentation role or the group's name.
attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

prop_statements:
  render:
    states: render replaces the rendered element with one the caller supplies
    because: >-
      Base UI's render prop takes an element or a function of the label's
      own state, so its type is a union of a React element and a callback - the compiler emits one JSON type per property.
  style:
    states: style accepts a function of the label's state as well as a plain style object
    because: >-
      Base UI widens React's `CSSProperties` to
      `CSSProperties | ((state) => CSSProperties)` so a caller can style off
      the primitive's own state (an empty object for a label). The compiler emits one JSON type per property, so nothing is asserted; the kit's own
      styling goes through dropdown-menu.module.css, not through this.

examples:
  good:
    - title: A caption over a sort choice
      code: |
        <DropdownMenuRadioGroup value={sort} onValueChange={setSort}>
          <DropdownMenuLabel>Sort by</DropdownMenuLabel>
          <DropdownMenuRadioItem value="name">Name</DropdownMenuRadioItem>
          <DropdownMenuRadioItem value="date">Date</DropdownMenuRadioItem>
        </DropdownMenuRadioGroup>
  bad:
    - title: A label straight under the popup
      code: |
        <DropdownMenuContent>
          <DropdownMenuLabel>Account</DropdownMenuLabel>
          <DropdownMenuItem>Profile</DropdownMenuItem>
        </DropdownMenuContent>
      why: >-
        There is no group for the label to name, so the primitive throws;
        wrap both in a DropdownMenuGroup.

family_membership:
  name: dropdown_menu
  role: part

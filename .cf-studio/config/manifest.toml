[manifest]
version = "2.0"

[[agents]]
id = "cf-analyze-planner"
description = "Invoke when the analyze workflow needs a reviewer execution plan: decompose the analyze run into reviewer-sub-agent tasks partitioned by methodology and path-partition, identify dependencies, and mark which tasks can run in parallel. Read-only; disk-mode plan files are written by the orchestrator from the returned plan. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-analyze-planner.md"

[[agents]]
id = "cf-brainstorm-expert"
description = "Invoke when contributing one expert's persona-scoped turn to a brainstorm round — parameterized by persona and mode (`topic` | `challenge`) passed in the dispatch prompt. Given {persona, topic, state, mode, challenged_decisions?}, returns either `{ relevant: false, reason }` (sit out) or `{ relevant: true, questions: [1..3], critique, next_topic_proposal }`. In `challenge` mode the expert pushes back on the supplied `challenged_decisions` from its persona's POV, emits challenge-mode `0..3` questions, allows a critique-only challenge, and sets `next_topic_proposal = null`; counter-proposals are emitted as the questions' `proposed_default`. Dispatched in parallel for the full panel per round. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-brainstorm-expert.md"

[[agents]]
id = "cf-brainstorm-facilitator"
description = "Invoke when opening a brainstorm session — one-shot per session. Given the initial topic plus rules.md / template / example / project context, proposes a 3-6-person expert panel (persona, focus, rationale) and a seed topic for round 1. Pure function: orchestrator collects user edits before the round loop starts. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-brainstorm-facilitator.md"

[[agents]]
id = "cf-brainstorm-panel"
description = "Invoke when running the single-agent panel-mode brainstorm round — dispatched once per round instead of per-expert fan-out. Owns serialized persona iteration (§4), per-iteration mirror writes (§6), anti-collapse guards G3-G5 (§8), envelope-emit contract with parse-time invariants (§9-§10), protocol branching (independent-then-critique, single-pass), and deterministic envelope rendering. Returns the `envelope` object the orchestrator flattens into `contributions[]`. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-brainstorm-panel.md"

[[agents]]
id = "cf-code-bug-finder"
description = "Invoke when running the code bug-finding methodology on code targets — expects the controller to inject that methodology and emits Findings for correctness, logic, reliability, security, concurrency, performance, and integration defects. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-code-bug-finder.md"

[[agents]]
id = "cf-codegen"
description = "Invoke when requirements are fully specified and code must be implemented in an isolated context without back-and-forth clarification — takes a complete task description and writes the code. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-codegen.md"

[[agents]]
id = "cf-deterministic-validator"
description = "Invoke when running target-applicable validation commands through the resolved validator command for the target bootstrap (`validate`, `validate --artifact`, `validate-toc`, `check-language`) and returning the canonical Deterministic Gate block (per-command exit code, JSON status, error_count, warning_count, overall PASS/FAIL/SKIPPED with availability proof). Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-deterministic-validator.md"

[[agents]]
id = "cf-diff-scope-resolver"
description = "Invoke when an analyze/review request targets a commit, branch, worktree, patch, or uncommitted changes — resolves the Git diff scope, changed files, omissions, and review targets while leaving `changed_hunks` empty in this structural-only mode, and only emits `risk_hotspots` when direct targets were explicitly named, so the orchestrator does not perform semantic diff scanning itself. Constructor Studio endpoint only; valid for dispatch from the cf skill/controller, not for standalone loading or use outside Constructor Studio flows."
source = "/Users/virtuozzo/gears-frontx/.claude/agents/cf-diff-scope-resolver.md"

[[agents]]

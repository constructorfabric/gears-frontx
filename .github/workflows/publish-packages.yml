name: Publish Packages

on:
  push:
    branches: [main, develop, 'release/v*']

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # FrontX ecosystem packages (packages/*)
  # Version-gated: a package publishes only when its package.json `version`
  # changed in this push. Ecosystem packages publish INDEPENDENTLY (F1
  # policy) — no layer/dependency ordering.
  #
  # The templates that consume these packages (@gears-frontx/api,
  # @gears-frontx/mfes, @gears-frontx/gts-plugin, ...) now live in their own
  # repository with their own publish workflow; this job no longer needs to
  # account for them.
  # ══════════════════════════════════════════════════════════════════════
  detect-ecosystem:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history needed for github.event.before comparison
          persist-credentials: false

      - name: Detect version changes
        id: detect
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          PACKAGES=()
          if [[ "$BASE_COMMIT" == "0000000000000000000000000000000000000000" ]]; then
            echo "No pre-push commit to compare; no versions selected."
            printf '%s\n' 'packages=[]' 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify "$BASE_COMMIT^{commit}" >/dev/null
          echo "Comparing HEAD against pre-push state: $BASE_COMMIT"

          candidates=$(mktemp "$RUNNER_TEMP/publish-candidates.XXXXXXXX")
          trap 'rm -f -- "$candidates"' EXIT
          node --input-type=module > "$candidates" <<'JS'
          import { readEcosystemPackages, readPackageManifest } from './scripts/ecosystem-packages.mjs';
          for (const { dir, name, version } of readEcosystemPackages(process.cwd())) {
            const path = `packages/${dir}`;
            if (readPackageManifest(`${path}/package.json`).private !== true) {
              console.log(JSON.stringify({ path, name, version }));
            }
          }
          JS
          while IFS= read -r row; do
            pkg_json="$(jq -er '.path' <<< "$row")/package.json"
            OLD_VERSION=""
            if git cat-file -e "$BASE_COMMIT:$pkg_json" 2>/dev/null; then
              OLD_VERSION=$(git show "$BASE_COMMIT:$pkg_json" | jq -r '.version')
            fi
            NEW_VERSION=$(jq -er '.version' <<< "$row")
            if [[ "$OLD_VERSION" != "$NEW_VERSION" ]]; then
              NPM_NAME=$(jq -er '.name' <<< "$row")
              echo "Version change detected: $NPM_NAME $OLD_VERSION -> $NEW_VERSION"
              PACKAGES+=("$row")
            fi
          done < "$candidates"

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "No ecosystem packages with version changes"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            # PUBLISH ORDER: @gears-frontx/gts-plugin declares an EXACT
            # dependency on @gears-frontx/mfes, so publishing it first puts a
            # tarball on the registry whose own dependency does not resolve yet.
            # Anyone installing gts-plugin in that window gets an ETARGET; the
            # window closes only when mfes lands. Manifest discovery order is
            # alphabetical, which puts gts-plugin BEFORE mfes - precisely the
            # wrong way round (review round 3 on #492).
            #
            # mfes first, gts-plugin last, everything else in between: the two
            # ranks encode the one intra-ecosystem exact pin that exists, and
            # `policy:ecosystem-pin-drift` is what keeps that pin honest, so a
            # second such edge cannot appear here unnoticed.
            JSON_ARRAY=$(printf '%s\n' "${PACKAGES[@]}" | jq -sc '
              def publishRank:
                if . == "@gears-frontx/mfes" then 0
                elif . == "@gears-frontx/gts-plugin" then 2
                else 1 end;
              sort_by((.name | publishRank), .name)')
            echo "Publish order: $(echo "$JSON_ARRAY" | jq -r '[.[].name] | join(" -> ")')"
            echo "packages=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  publish-ecosystem:
    needs: detect-ecosystem
    if: needs.detect-ecosystem.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      skipped: ${{ steps.publish.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Edge-compatibility check (independent publication)
        # F1 Ecosystem Distribution & Versioning Policy — per-concern INDEPENDENT
        # versioning: each artifact publishes on its own semver line; NO matched-
        # version gate. Blocks publication only of @gears-frontx/mfes, and only
        # when its declared @gears-frontx/gts-plugin range is an exact pin or is
        # unsatisfiable against the published gts-plugin version(s).
        run: npm run policy:version-check

      - name: Build ecosystem packages
        run: npm run build:packages

      - name: Select unpublished versions
        id: selection
        shell: bash
        env:
          PACKAGES: ${{ needs.detect-ecosystem.outputs.packages }}
        run: |
          audit_root=$(mktemp -d "$RUNNER_TEMP/production-audit.XXXXXXXX")
          echo "audit_root=$audit_root" >> "$GITHUB_OUTPUT"
          pending=() skipped=()
          jq -c 'if type == "array" then .[] else error("expected package list") end' <<< "$PACKAGES" > "$audit_root/candidates.jsonl"
          while IFS= read -r row; do
            name=$(jq -er '.name' <<< "$row")
            version=$(jq -er '.version' <<< "$row")
            if npm view "$name@$version" version --json --prefer-online > "$audit_root/view.json" 2> "$audit_root/view.err"; then
              jq -e --arg version "$version" '. == $version' "$audit_root/view.json" >/dev/null
              echo "SKIPPING: $name@$version already exists on NPM"
              skipped+=("$(jq -c '. | {name,version,reason:"already exists on NPM"}' <<< "$row")")
            elif jq -e -s 'length == 1 and .[0].error.code == "E404"' "$audit_root/view.json" >/dev/null; then
              pending+=("$row")
            else
              cat "$audit_root/view.json" "$audit_root/view.err" >&2
              echo "Could not determine registry status for $name@$version" >&2
              exit 1
            fi
          done < "$audit_root/candidates.jsonl"
          printf '%s\n' "${pending[@]}" | jq -sc '.' > "$audit_root/publish-set.json"
          printf '%s\n' "${skipped[@]}" | jq -sc '.' > "$audit_root/skipped.json"

      - name: Audit production package artifacts (high severity)
        env:
          AUDIT_ROOT: ${{ steps.selection.outputs.audit_root }}
        shell: bash
        run: |
          args=(--output-dir "$AUDIT_ROOT/gate")
          count=$(jq -er -s '
            if length == 1 and (.[0] | type) == "array" then .[0] | length
            else error("expected a single publish set array") end
          ' "$AUDIT_ROOT/publish-set.json")
          if (( count > 0 )); then
            args+=(--publish-set "$AUDIT_ROOT/publish-set.json")
          fi
          npm run audit:production -- "${args[@]}"

      - name: Publish audited packages
        id: publish
        shell: bash
        env:
          AUDIT_ROOT: ${{ steps.selection.outputs.audit_root }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PUBLISHED_PACKAGES=()

          BRANCH="${GITHUB_REF#refs/heads/}"
          get_npm_tag() {
            local version="$1"
            if [[ "$BRANCH" =~ ^release/v([0-9]+)$ ]]; then echo "v${BASH_REMATCH[1]}";
            elif [[ "$BRANCH" == "develop" ]]; then echo "alpha";
            elif [[ "$BRANCH" == "main" ]]; then
              if [[ "$version" == *"-alpha"* ]]; then echo "alpha";
              elif [[ "$version" == *"-rc"* ]]; then echo "next";
              else echo "latest"; fi
            elif [[ "$version" == *"-alpha"* ]]; then echo "alpha";
            elif [[ "$version" == *"-beta"* ]]; then echo "beta";
            elif [[ "$version" == *"-rc"* ]]; then echo "next";
            else echo "latest"; fi
          }

          publish_with_retry() {
            local tag="$1" tarball="$2" digest="$3" name="$4" version="$5"
            local max_attempts=3 attempt=1 delay=5 actual
            while [ "$attempt" -le "$max_attempts" ]; do
              actual=$(sha256sum < "$tarball") || return 1
              if [[ "${actual%% *}" != "$digest" ]]; then
                echo "Audit receipt digest mismatch for $name@$version" >&2
                return 1
              fi
              tar -xOzf "$tarball" -- package/package.json |
                jq -es --arg name "$name" --arg version "$version" \
                  'length == 1 and .[0].name == $name and .[0].version == $version' >/dev/null || {
                    echo "Packed package identity mismatch for $name@$version" >&2
                    return 1
                  }
              echo "Publish attempt $attempt of $max_attempts..."
              if npm publish "$tarball" --ignore-scripts --access public --tag "$tag"; then return 0; fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Attempt $attempt failed. Retrying in ${delay}s..."
                sleep "$delay"; delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "All $max_attempts attempts failed"; return 1
          }

          # Version selection preserves the original mfes-before-gts-plugin order.
          gate=$(realpath -- "$AUDIT_ROOT/gate")
          receipt="$gate/receipt.json"
          jq -e -s 'length == 1 and (.[0].packages | type) == "array"' "$receipt" >/dev/null
          jq -c '.[]' "$AUDIT_ROOT/publish-set.json" > "$AUDIT_ROOT/pending.jsonl"
          while IFS= read -r row; do
            name=$(jq -er '.name' <<< "$row")
            version=$(jq -er '.version' <<< "$row")
            audited=$(jq -ce --arg name "$name" --arg version "$version" '
              [.packages[] | select(.name == $name)] |
              if length == 1 and .[0].version == $version then .[0]
              else error("missing, duplicate or mismatched audit receipt for " + $name) end
            ' "$receipt")
            tarball=$(jq -er '.tarball | strings | select(startswith("/"))' <<< "$audited")
            tarball=$(realpath -- "$tarball")
            digest=$(jq -er '.sha256 | strings | select(test("^[0-9a-f]{64}$"))' <<< "$audited")
            if [[ "$tarball" != "$gate/"*.tgz || ! -f "$tarball" ]]; then
              echo "Invalid audited tarball path for $name@$version" >&2
              exit 1
            fi

            tag=$(get_npm_tag "$version")
            echo "Publishing audited $name@$version with tag '$tag'..."
            publish_with_retry "$tag" "$tarball" "$digest" "$name" "$version" || {
              echo "FAILED: $name@$version" >&2
              exit 1
            }
            PUBLISHED_PACKAGES+=("$(jq -c '{name,version}' <<< "$row")")
          done < "$AUDIT_ROOT/pending.jsonl"

          echo "published=$(printf '%s\n' "${PUBLISHED_PACKAGES[@]}" | jq -sc '.')" >> "$GITHUB_OUTPUT"
          echo "skipped=$(cat "$AUDIT_ROOT/skipped.json")" >> "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════════════════════════════════
  # Summary
  # ══════════════════════════════════════════════════════════════════════
  summary:
    needs: [detect-ecosystem, publish-ecosystem]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          report() {
            local title="$1" has_changes="$2" result="$3" published="$4" skipped="$5"
            echo "### $title" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$has_changes" != "true" ]; then
              echo "No packages with version changes to publish." >> $GITHUB_STEP_SUMMARY
            elif [ "$result" == "success" ]; then
              local pc sc
              pc=$(echo "$published" | jq 'length'); sc=$(echo "$skipped" | jq 'length')
              if [ "$pc" -gt 0 ]; then
                echo "✅ Published ($pc):" >> $GITHUB_STEP_SUMMARY
                echo "$published" | jq -r '.[] | "- `\(.name)@\(.version)`"' >> $GITHUB_STEP_SUMMARY
              fi
              if [ "$sc" -gt 0 ]; then
                echo "⏭️ Skipped ($sc):" >> $GITHUB_STEP_SUMMARY
                echo "$skipped" | jq -r '.[] | "- `\(.name)@\(.version)` — \(.reason)"' >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "❌ Publish failed. Check workflow logs for details." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          }

          report "Ecosystem packages" \
            "${{ needs.detect-ecosystem.outputs.has_changes }}" \
            "${{ needs.publish-ecosystem.result }}" \
            '${{ needs.publish-ecosystem.outputs.published }}' \
            '${{ needs.publish-ecosystem.outputs.skipped }}'
